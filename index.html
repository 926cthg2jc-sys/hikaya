<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hekaya小故事｜个人书架</title>
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei", system-ui, sans-serif; }
        :root{
            --bg:#f5f3ef; --card-bg:#ffffff; --text-color:#2d2d2d; --sub-text:#6b6b6b;
            --primary:#6c5ce7; --primary-light:#a29bfe; --primary-gradient:linear-gradient(135deg,#6c5ce7,#a29bfe);
            --secondary-gradient:linear-gradient(135deg,#fd79a8,#fab1a0); --accent-gradient:linear-gradient(135deg,#00b894,#00cec9);
            --border:#e8e8e8; --shadow:0 4px 15px rgba(0,0,0,0.06); --shadow-hover:0 12px 40px rgba(108,92,231,0.15);
            --success:#00b894; --warning:#fdcb6e; --error:#ff6b6b; --info:#74b9ff;
            --radius-sm:10px; --radius-md:16px; --radius-lg:24px; --radius-xl:32px;
            --transition-fast:0.2s ease; --transition-normal:0.3s ease; --transition-slow:0.5s ease;
        }
        .dark{
            --bg:#0d0d0d; --card-bg:#1a1a2e; --text-color:#f8f8f8; --sub-text:#888888;
            --primary:#a29bfe; --primary-light:#6c5ce7; --primary-gradient:linear-gradient(135deg,#a29bfe,#6c5ce7);
            --border:#2d2d44; --shadow:0 4px 15px rgba(0,0,0,0.2); --shadow-hover:0 12px 40px rgba(108,92,231,0.3);
        }
        body{ background:var(--bg); color:var(--text-color); min-height:100vh; overflow-x:hidden; overflow-y:auto; }
        
        .modal-overlay{
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.5); backdrop-filter: blur(15px); z-index:10000;
            display:flex; align-items:center; justify-content:center; padding:20px; margin:0;
        }
        .reading-overlay{
            position:fixed !important; top:0 !important; left:0 !important; width:100% !important; height:100vh !important;
            background:rgba(0,0,0,0.5) !important; backdrop-filter: blur(15px) !important; z-index:10000 !important;
            padding:20px !important; margin:0 !important;
            overflow-y:auto !important;
            display:block !important;
            align-items:normal !important;
            justify-content:normal !important;
        }

        #welcomePage{
            position:fixed; top:0; left:0; right:0; bottom:0;
            background:#1a2f23; display:flex; align-items:center; justify-content:center;
            padding:40px 20px; z-index:100;
        }
        #welcomePage.hidden{ display:none; }
         
        .welcome-container{
            background:#1a2f23; border-radius:24px; padding:60px 80px;
            max-width:900px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.4); position:relative;
        }
        .welcome-top-label{ text-align:center; color:#6b8e7b; font-size:12px; letter-spacing:3px; margin-bottom:20px; text-transform:uppercase; }
        .welcome-title{ text-align:center; color:#fff; font-size:36px; font-weight:700; margin-bottom:50px; letter-spacing:-1px; }
        
        .welcome-books-container{
            display:flex; justify-content:center; align-items:flex-end; gap:-20px;
            margin-bottom:30px; perspective:1000px;
        }
        .welcome-book-cover{
            width:140px; height:200px; border-radius:8px; overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,0.3); transition:transform 0.3s ease;
            cursor:pointer; position:relative;
        }
        .welcome-book-cover:hover{ transform:translateY(-10px) scale(1.05); z-index:10; }
        .welcome-book-cover img{ width:100%; height:100%; object-fit:cover; }
        .welcome-book-cover:nth-child(1){ transform:rotate(-8deg) translateX(20px); }
        .welcome-book-cover:nth-child(2){ transform:rotate(-4deg) translateX(10px); }
        .welcome-book-cover:nth-child(3){ transform:rotate(2deg); }
        .welcome-book-cover:nth-child(4){ transform:rotate(6deg) translateX(-10px); }
        .welcome-book-cover:hover:nth-child(1){ transform:rotate(-5deg) translateX(20px) translateY(-10px) scale(1.05); }
        .welcome-book-cover:hover:nth-child(2){ transform:rotate(-2deg) translateX(10px) translateY(-10px) scale(1.05); }
        .welcome-book-cover:hover:nth-child(3){ transform:rotate(0deg) translateY(-10px) scale(1.05); }
        .welcome-book-cover:hover:nth-child(4){ transform:rotate(4deg) translateX(-10px) translateY(-10px) scale(1.05); }
        
        .welcome-meta-info{ text-align:center; color:#6b8e7b; font-size:13px; margin-bottom:40px; letter-spacing:1px; }
        
        .welcome-edit-btn, .welcome-login-btn{
            position:absolute; top:20px; right:20px; padding:10px 20px;
            background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
            border-radius:20px; color:#fff; font-size:13px; cursor:pointer; transition:all 0.3s ease;
        }
        .welcome-edit-btn:hover, .welcome-login-btn:hover{ background:rgba(255,255,255,0.2); }
        .welcome-edit-btn{ display:none; }
        .admin-login .welcome-edit-btn{ display:block; }
        .admin-login .welcome-login-btn{ display:none; }
        
        .start-reading-btn{
            display:flex; width:50px; height:50px; margin:20px auto 0; padding:0;
            background:#4a9060; border:none; border-radius:50%; color:#fff; font-size:20px;
            cursor:pointer; transition:all 0.3s ease; align-items:center; justify-content:center;
        }
        .start-reading-btn:hover{ background:#3a8050; transform:translateY(-2px) scale(1.1); box-shadow:0 5px 20px rgba(74,144,96,0.3); }
        
        .welcome-modal-content{ background:#2a4535; border-radius:20px; padding:40px; max-width:600px; width:100%; max-height:80vh; overflow-y:auto; position:relative; color:#fff; scrollbar-width:thin; scrollbar-color:#4a9060 #1a2f23; }
        .welcome-modal-content::-webkit-scrollbar{ width:6px; }
        .welcome-modal-content::-webkit-scrollbar-track{ background:#1a2f23; border-radius:3px; }
        .welcome-modal-content::-webkit-scrollbar-thumb{ background:#4a9060; border-radius:3px; }
        .welcome-modal-content::-webkit-scrollbar-thumb:hover{ background:#3a8050; }
        .welcome-modal-title{ font-size:24px; font-weight:600; margin-bottom:30px; text-align:center; }
        .welcome-close-modal-btn{ position:absolute; top:15px; right:15px; background:none; border:none; color:#fff; font-size:28px; cursor:pointer; width:35px; height:35px; display:flex; align-items:center; justify-content:center; }
        .welcome-form-group{ margin-bottom:20px; }
        .welcome-form-group label{ display:block; font-size:14px; color:#6b8e7b; margin-bottom:8px; }
        .welcome-form-group input{ width:100%; padding:12px 15px; background:#1a2f23; border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:#fff; font-size:14px; outline:none; }
        .welcome-form-group input:focus{ border-color:#4a9060; }
        .welcome-book-preview{ display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
        .welcome-add-form{ background:rgba(255,255,255,0.05); padding:20px; border-radius:10px; margin-top:15px; }
        .welcome-meta-preview{ display:flex; flex-direction:column; gap:10px; margin-bottom:15px; }
        .welcome-meta-item{ display:flex; gap:10px; align-items:center; }
        .welcome-meta-item input{ flex:1; padding:10px 12px; background:#1a2f23; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#fff; font-size:13px; outline:none; }
        .welcome-meta-item input:focus{ border-color:#4a9060; }
        .welcome-add-meta{ display:flex; gap:10px; }
        .welcome-add-meta input{ flex:1; padding:10px 12px; background:#1a2f23; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#fff; font-size:13px; outline:none; }
        .welcome-preview-item{ width:80px; height:110px; border-radius:6px; overflow:hidden; position:relative; border:2px solid transparent; cursor:pointer; }
        .welcome-preview-item.selected{ border-color:#4a9060; }
        .welcome-preview-item img{ width:100%; height:100%; object-fit:cover; }
        .welcome-preview-item .welcome-edit-btn{ position:absolute; top:5px; left:5px; width:20px; height:20px; background:rgba(74,144,96,0.8); border:none; color:#fff; font-size:10px; cursor:pointer; border-radius:50%; display:flex; align-items:center; justify-content:center; }
        .welcome-preview-item .welcome-remove-btn{ position:absolute; top:5px; right:5px; width:20px; height:20px; background:rgba(0,0,0,0.7); border:none; color:#fff; font-size:12px; cursor:pointer; border-radius:50%; display:flex; align-items:center; justify-content:center; }
        .welcome-link-info{ font-size:10px; color:#666; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .welcome-upload-btn{ display:block; width:100%; padding:12px; background:#4a9060; border:none; border-radius:10px; color:#fff; font-size:14px; cursor:pointer; margin-bottom:15px; }
        .welcome-upload-btn:hover{ background:#3a8050; }
        .welcome-save-btn{ display:block; width:100%; padding:14px; background:#4a9060; border:none; border-radius:10px; color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
        .welcome-save-btn:hover{ background:#3a8050; }
        .welcome-login-form{ text-align:center; }
        .welcome-login-form input{ width:100%; padding:12px 15px; background:#1a2f23; border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:#fff; font-size:14px; outline:none; margin-bottom:15px; }
        .welcome-login-form input:focus{ border-color:#4a9060; }
        .welcome-login-form button{ width:100%; padding:14px; background:#4a9060; border:none; border-radius:10px; color:#fff; font-size:16px; font-weight:600; cursor:pointer; }

        #bookshelfPage{ display:none; }
        #bookshelfPage.active{ display:block; }
        
        .main-content{ zoom:0.8; }
        
        .header{ display:flex; align-items:center; justify-content:space-between; padding:20px 30px; background:var(--card-bg); border-radius:var(--radius-lg); box-shadow:var(--shadow); margin-bottom:30px; }
        .logo{ font-size:24px; font-weight:700; background:var(--primary-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; cursor:pointer; }
        .header-right{ display:flex; align-items:center; gap:15px; }
        .theme-toggle-btn{
            width:40px; height:40px; border:none; border-radius:50%;
            background:var(--card-bg); border:1px solid var(--border);
            font-size:18px; cursor:pointer; transition:var(--transition-normal);
            display:flex; align-items:center; justify-content:center;
        }
        .theme-toggle-btn:hover{ transform:rotate(20deg); border-color:var(--primary); }
        
        .btn-common{ padding:12px 24px; border:none; border-radius:var(--radius-md); font-size:14px; font-weight:600; cursor:pointer; transition:var(--transition-normal); }
        .btn-primary{ background:var(--primary-gradient); color:#fff; }
        .btn-primary:hover{ transform:translateY(-2px); box-shadow:var(--shadow-hover); }
        .btn-outline{ background:transparent; border:2px solid var(--primary); color:var(--primary); }
        .btn-outline:hover{ background:var(--primary); color:#fff; }
        .btn-secondary{ background:var(--secondary-gradient); color:#fff; }
        .btn-sm{ padding:8px 16px; font-size:12px; }
        
        .search-box{ max-width:500px; width:100%; margin:0 auto 25px; position:relative; }
        #searchInput{ width:100%; padding:16px 20px 16px 50px; border:1px solid var(--border); border-radius:var(--radius-xl); font-size:15px; background:var(--card-bg); color:var(--text-color); box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); }
        #searchInput:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(141,110,99,0.2), inset 0 2px 5px rgba(0,0,0,0.05); }
        .search-icon{ position:absolute; left:20px; top:50%; transform:translateY(-50%); color:var(--sub-text); font-size:18px; }
        .search-result-count{ text-align:center; font-size:14px; color:var(--sub-text); margin-bottom:20px; min-height:20px; }
        
        .category-tabs{ display:flex; justify-content:center; flex-wrap:wrap; gap:12px; margin-bottom:25px; }
        .tab{ padding:12px 24px; background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius-xl); font-size:15px; color:var(--text-color); cursor:pointer; transition:var(--transition-normal); }
        .tab:hover{ border-color:var(--primary); color:var(--primary); }
        .tab.active{ background:var(--primary-gradient); color:#fff; border:none; }
        
        .sort-box{ display:flex; justify-content:center; margin-bottom:20px; }
        #sortSelect{ padding:10px 20px; background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius-md); color:var(--text-color); font-size:14px; cursor:pointer; outline:none; }
        
        .bookshelf{ display:grid; grid-template-columns:repeat(6, 1fr); gap:20px; padding:0; max-width:1200px; margin:0 auto; }
        .book-card{ background:var(--card-bg); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow); transition:var(--transition-normal); position:relative; cursor:pointer; }
        .book-card:hover{ transform:translateY(-8px); box-shadow:var(--shadow-hover); }
        .book-card.top{ border:2px solid var(--primary); }
        .book-cover{ width:100%; height:260px; object-fit:cover; display:block; }
        .book-info{ padding:15px; text-align:center; }
        .book-title{ font-size:15px; font-weight:600; color:var(--text-color); margin-bottom:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; }
        .book-cate{ font-size:12px; color:var(--sub-text); padding:4px 10px; background:rgba(108,92,231,0.1); border-radius:var(--radius-sm); display:inline-block; }
        
        .top-tag{ position:absolute; top:10px; left:10px; background:var(--primary-gradient); color:#fff; padding:4px 12px; border-radius:var(--radius-sm); font-size:12px; font-weight:600; z-index:2; }
        .top-btn, .del-btn, .edit-card-btn{
            position:absolute; width:35px; height:35px; border:none; border-radius:50%; font-size:16px; cursor:pointer; transition:var(--transition-fast); display:none; align-items:center; justify-content:center;
        }
        .top-btn{ top:10px; right:10px; background:rgba(255,255,255,0.9); }
        .del-btn{ bottom:10px; right:10px; background:rgba(255,107,107,0.9); color:#fff; }
        .edit-card-btn{ bottom:10px; right:50px; background:rgba(108,92,231,0.9); color:#fff; font-size:14px; }
        .admin-btns-show .top-btn, .admin-btns-show .del-btn, .admin-btns-show .edit-card-btn{ display:flex; }
        
        .upload-box{ background:var(--card-bg); border-radius:var(--radius-lg); padding:30px; box-shadow:var(--shadow); margin-bottom:30px; max-width:600px; margin-left:auto; margin-right:auto; }
        .upload-box h3{ font-size:20px; margin-bottom:25px; color:var(--text-color); }
        .form-group{ margin-bottom:20px; }
        .form-group input, .form-group select{ width:100%; padding:14px 18px; border:1px solid var(--border); border-radius:var(--radius-md); font-size:14px; background:var(--card-bg); color:var(--text-color); outline:none; }
        .form-group input:focus, .form-group select:focus{ border-color:var(--primary); box-shadow:0 0 0 3px rgba(108,92,231,0.1); }
        .form-group textarea{ width:100%; padding:14px 18px; border:1px solid var(--border); border-radius:var(--radius-md); font-size:14px; background:var(--card-bg); color:var(--text-color); outline:none; min-height:120px; resize:vertical; }
        .form-group textarea:focus{ border-color:var(--primary); box-shadow:0 0 0 3px rgba(108,92,231,0.1); }
        .form-group label{ font-size:13px; color:var(--sub-text); margin-bottom:8px; display:block; }
        
        .upload-toggle-box{ text-align:center; margin-bottom:20px; }
        #uploadToggle{ padding:12px 30px; background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius-md); color:var(--text-color); font-size:14px; cursor:pointer; }
        #uploadToggle:hover{ border-color:var(--primary); color:var(--primary); }
        .hide-upload{ display:none; }
        
        .empty-tip{ text-align:center; padding:80px 20px; color:var(--sub-text); font-size:18px; }
        
        .read-page{
            position:fixed; top:0; left:0; right:0; bottom:0; width:100vw; height:100vh;
            background:var(--bg); z-index:9999;
            display:none; flex-direction:column; align-items:center; justify-content:flex-start;
            padding:40px 20px 80px; overflow-y:auto; margin:0;
        }
        .read-page.show{ display:flex; }
        .read-back-btn{
            position:fixed; top:25px; left:25px; padding:12px 28px;
            border-radius:var(--radius-xl); border:none; background:var(--primary-gradient); color:#fff;
            font-size:15px; cursor:pointer; box-shadow:0 4px 15px rgba(141,110,99,0.3);
            z-index:10; transition:all 0.3s ease; font-weight:500;
        }
        .read-back-btn:hover{ transform:translateY(-3px); box-shadow:0 6px 20px rgba(141,110,99,0.4); }
        .read-content{ max-width:700px; width:100%; text-align:center; padding-top:80px; padding-bottom:50px; }
        .read-cover{ width:100%; max-width:350px; border-radius:var(--radius-lg); box-shadow:var(--shadow-hover); margin:0 auto 30px; border:1px solid var(--border); }
        .read-title{ font-size:32px; font-weight:700; margin-bottom:15px; color:var(--text-color); line-height:1.3; }
        .read-cate{ font-size:14px; color:var(--primary); padding:5px 14px; background:rgba(108,92,231,0.1); border-radius:var(--radius-md); display:inline-block; margin-bottom:15px; font-weight:500; }
        .read-tags{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin:10px 0 15px; }
        .read-tag{ font-size:12px; color:var(--primary); padding:4px 10px; background:rgba(108,92,231,0.08); border-radius:var(--radius-md); font-weight:500; }
        .read-desc{ font-size:16px; color:var(--text-color); line-height:1.8; margin:20px 0; padding:15px; background:rgba(141,110,99,0.05); border-radius:var(--radius-md); direction:rtl; text-align:justify; unicode-bidi:plaintext; }
        .read-actions{ display:flex; gap:18px; justify-content:center; margin:25px 0; flex-wrap:wrap; }
        .read-btn{ padding:14px 28px; border-radius:var(--radius-xl); background:var(--primary-gradient); color:white; border:none; cursor:pointer; font-size:15px; transition:all 0.3s; font-weight:500; min-width:150px; display:flex; align-items:center; justify-content:center; gap:8px; }
        .read-btn:hover{ transform:translateY(-3px); box-shadow:0 6px 15px rgba(0,0,0,0.2); }
        
        .edit-modal{ background:var(--card-bg); border-radius:var(--radius-lg); padding:30px; max-width:600px; width:100%; max-height:90vh; overflow-y:auto; position:relative; }
        .edit-modal h2{ font-size:22px; margin-bottom:25px; color:var(--text-color); }
        .modal-close-btn{ position:absolute; top:15px; right:15px; background:none; border:none; color:var(--text-color); font-size:28px; cursor:pointer; width:35px; height:35px; display:flex; align-items:center; justify-content:center; border-radius:50%; transition:background 0.2s; }
        .modal-close-btn:hover{ background:rgba(0,0,0,0.1); }
        
        .login-modal{ background:var(--card-bg); border-radius:var(--radius-lg); padding:50px 40px 40px; max-width:400px; width:100%; position:relative; text-align:center; }
        .login-modal h2{ font-size:24px; margin-bottom:30px; color:var(--text-color); }
        .login-modal input{ width:100%; padding:14px 18px; border:1px solid var(--border); border-radius:var(--radius-md); font-size:14px; background:var(--card-bg); color:var(--text-color); outline:none; margin-bottom:20px; }
        .login-modal input:focus{ border-color:var(--primary); box-shadow:0 0 0 3px rgba(108,92,231,0.1); }
        .login-modal button{ width:100%; padding:14px; background:var(--primary-gradient); border:none; border-radius:var(--radius-md); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
        
        .toast{ position:fixed; top:20px; right:20px; padding:16px 24px; border-radius:var(--radius-md); color:#fff; font-size:14px; font-weight:600; z-index:20000; animation:slideIn 0.3s ease; }
        .toast-success{ background:var(--success); }
        .toast-error{ background:var(--error); }
        .toast-info{ background:var(--info); }
        @keyframes slideIn{ from{ transform:translateX(100%); opacity:0; } to{ transform:translateX(0); opacity:1; } }
        
        .yazmilar-list{ display:flex; flex-direction:column; gap:25px; max-width:800px; margin:0 auto; }
        .yazmilar-item{ background:var(--card-bg); border-radius:var(--radius-lg); padding:30px 40px; box-shadow:var(--shadow); position:relative; transition:transform 0.3s ease, box-shadow 0.3s ease; cursor:pointer; }
        .yazmilar-item:hover{ transform:translateX(8px); box-shadow:var(--shadow-hover); }
        .yazmilar-text{ font-size:17px; color:var(--text-color); line-height:1.8; text-align:justify; margin-bottom:15px; }
        .yazmilar-meta{ display:flex; justify-content:space-between; align-items:center; }
        .yazmilar-tags{ display:flex; flex-wrap:wrap; gap:6px; }
        .yazmilar-tag{ font-size:11px; color:var(--primary); padding:2px 8px; background:rgba(108,92,231,0.1); border-radius:var(--radius-sm); }
        
        .carousel-container{ position:relative; width:100%; max-width:1200px; margin:0 auto 30px; overflow:hidden; border-radius:var(--radius-lg); }
        .carousel{ display:flex; transition:transform 0.5s ease; }
        .carousel-slide{ min-width:100%; height:400px; position:relative; cursor:pointer; }
        .carousel-slide img{ width:100%; height:100%; object-fit:cover; }
        .carousel-overlay{ position:absolute; top:0; left:0; right:0; bottom:0; background:transparent; }
        .carousel-caption{ position:absolute; bottom:40px; left:40px; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,0.5); }
        .carousel-caption h3{ font-size:28px; margin-bottom:10px; }
        .carousel-caption p{ font-size:16px; opacity:0.9; }
        .carousel-controls{ position:absolute; top:50%; transform:translateY(-50%); width:100%; display:flex; justify-content:space-between; padding:0 10px; pointer-events:none; }
        .carousel-controls button{ width:36px; height:36px; border:none; border-radius:50%; background:rgba(255,255,255,0.2); color:#fff; font-size:14px; cursor:pointer; opacity:0.6; transition:all 0.3s ease; pointer-events:auto; }
        .carousel-controls button:hover{ background:rgba(255,255,255,0.4); opacity:1; }

      "desc": "بۇرۇننىڭ بۇرۇنىسىدا چىرايلىق ۋە ئوماق بىر قىزچاق بار ئىكەن. ئۇنىڭغا ھەممەيلەن ئامراق ئىكەن. بولۇپمۇ ئۇ- نىڭ مومىسى قىزچاق ئۈچۈن جېنىنى بېرىشكىمۇ رازى ئى- كەن. بىر كۈنى مومىسى قىزچاققا قىزىل مامۇقتىن تىكىل- گەن بۆك سوۋغا قىپتۇ. بۇ بۆك ئۇنىڭغا شۇنچىلىك يارى- شىپتۇ. قىزچاق ئۇنى ھەمىشە كىيىپ يۈرىدىكەن. شۇڭا، قىزچاقنى ھەممە ئادەم قىزىل بۆك، دەپ ئاتايدىغان بوپتۇ. \n        بىر كۈنى ئاپىسى ئۇنىڭغا： \n      _ قىزىل بۆك، ماۋۇ قاتلىما نان بىلەن بىر بوتۇلكا ئۈزۈم ھارىقىنى موماڭغا ئاپىرىپ بېرىپ كەل. ئۇنىڭ تېنى ئاجىز، بۇلارنى يەپ - ئىچسە بىرئاز ماغدۇرىغا كېلىپ قالار. ھاۋا ئىسسىپ كەتكۈچە موماڭنىڭ قېشىغا بېرىۋال. يولدا شوخلۇق قىلماي تۈز ماڭغىن. يىقىلىپ چۈشسەڭ بو- تۇلكا چېقىلىپ ئۈزۈم ھارىقى تۆكۈلۈپ كېتىدۇ - دە، مو- ماڭغا ھېچنېمە قالمايدۇ. موماڭنىڭ يېنىغا كىرگەندە ھاڭۋاقتىلىق قىلماي، موما، ياخشى تۇردىڭىزمۇ؟ دەپ تىنچ- لىق سورا، _ دەپ تاپىلاپتۇ. \n      _ دېگەنلىرىڭىزنى چوقۇم قۇلىقىمدا تۇتىمەن، _دەپتۇ قىزىل بۆك ۋە ئاپىسى بىلەن خوشلىشىپ يولغا راۋان بوپتۇ. \nقىزىل بۆكنىڭ مومىسى ئورماندا تۇرىدىكەن. يېزىدىن ئۇ يەرگە يېرىم سائەتلەردە بارغىلى بولىدىكەن. قىزىل بۆك ئورمانغا يېتەي دەپ قالغاندا بۆرىگە ئۇچراپ قاپتۇ. ئۇ بۆرى- نىڭ بەكمۇ ۋەھشىي ھايۋان ئىكەنلىكىنى زادىلا ئاڭلىمىغا- نىكەن. شۇڭا، ئۇ بۆرىدىن قورقۇشنى خىيالىغىمۇ كەلتۈر- مەپتۇ.\n       _ ياخشى تۇرۇپسىز، قىزىل بۆك، _ دەپتۇ بۆرە.       _ رەھمەت سىزگە، بۆرىجان، _ دەپتۇ قىزىل بۆك.        _ قىزىل بۆك، مۇنچە ئەتىگەندە قاياققا يول ئالدىڭىز؟       — مومامنىڭكىگە       — ئېتىكىڭىزدىكى نېمە ئۇ؟_ قاتلىما نان بىلەن ئۈزۈم ھارىقى. تۈنۈگۈن ئاپام قاتلىما نان سالغانىدى. ئۇنى قۇۋۋەت بولسۇن، دەپ مومامغا ئەكېتىپ بارىمەن.       _ قىزىل بۆك، مومىڭىزنىڭ ئۆيى نەدىرەك؟      _ ئورماندا، يەنە چارەك سائەت ماڭساملا يېتىپ بارى- مەن. مومامنىڭ ئۆيى يوغان ئۈچ تۈپ كاۋچوك دەرىخىنىڭ ئاستىدا، ئۆپچۆرىسى ياڭاق شاخلىرى بىلەن قاشالانغان. سىز ئۇ يەرنى چوقۇم بىلىسىز. \n    «بۇ گۆدەك قىزچاقنىڭ گۆشى مومىسىنىڭكىگە قارىغاندا يۇمران ھەم تەملىك. مەن ھىيلە ئىشلىتىپ ھەر ئىككىلىسىنى قولۇمغا چۈشۈرەي» دەپ ئويلاپتۇ بۆرە ۋە كېتىپ بېرىپ قىزىل بۆككە دەپتۇ：      _ قىزىل بۆك، ئەتراپىڭىزدا شۇنچە چىرايلىق ئېچىلغان گۈللەر تۇرسىمۇ قاراپ قويمايدىكەنسىز، بۇلبۇللار شۇنچە يېقىملىق سايراۋاتسا قۇلاق سېلىپمۇ باقمايدىكەنسىز. خۇددى مەكتەپكە كېتىپ بارغان بالىدەك ئۇدۇل كېتىۋېرى- دىكەنسىز. ئورماننىڭ نەقەدەر كۆڭۈللۈك ئىكەنلىكىنى بىلمەيدىغان ئوخشايسىز - ھە؟\n      بۆرىنىڭ گېپىنى ئاڭلىغان قىزىل بۆك ئەتراپىغا شۇنداق قاراپتىكەن، پاھ، قۇياشنىڭ ئالتۇن رەڭ نۇرلىرى دەرەخ شاخلىرى ئارىسىدا خۇددى مۆكىمۆكىلەڭ ئويناۋاتقان- دەك گاھ كۆرۈنۈپ، گاھ يوقىلىپ تۇرغۇدەك، ھەممىلا يەردە رەڭگارەڭ گۈللەر ھۈپپىدە ئېچىلىپ كەتكەنمىش. «مومامغا بىر دەستە گۈل ئالغاچ بارسام، ئۇ تېخىمۇ خۇشال بولمامدۇ. تېخى ئەتىگەن تۇرسا، مومامنىڭكىگە بىردەمدىلا بارمامدىمەن» دەپ ئويلاپتۇ قىزىل بۆك چوڭ يولدىن چىقىپ گۈل تەرگىلى ئورماننىڭ ئىچىگە كىرىپتۇ. ئۇ بىر تال گۈلنى ئۈزۈشىگە، نېرىراقتىكى گۈل ئۇنىڭغا تېخىمۇ چىرايلىق كۆرۈنۈپ كېتىدىكەن. شۇنىڭ بىلەن، ئۇ يۈگۈرۈپ بېرىپ ئۇ گۈلنىمۇ ئۈزۈۋالىدىكەن. قىزىل بۆك شۇنداق قىلىپ گۈلدىن گۈلگە قونۇپ يۈرگەن كېپىنەككە ئوخشاش، ئورماننىڭ ئىچكىرىسىگە بارغانسېرى كىرىپ كېتىپتۇ.\n     شۇ ئەسنادا، بۆرە قىزىل بۆكنىڭ مومىسىنىڭكىگە بېرىپ ئىشىكنى چېكىپتۇ.\n      — كىم؟ _ دەپ سوراپتۇ مومىسى.     _ مەن، قىزىل بۆك، _ دەپتۇ بۆرە، _ موما، ئىشىكنى ئېچىڭ. سىزگە قاتلىما نان بىلەن ئۈزۈم ھارىقى ئەكەلدىم.      _ قوپقۇدەك ھالىم يوق، ئىشىكنى ئۆزۈڭ ئاچ. تۇت- قۇچنى بۇرىساڭلا ئۆزى ئېچىلىدۇ. \n      بۆرە ئىشىكنى ئېچىپ كىرىپلا ئۇدۇل قىزىل بۆكنىڭ مومىسى ياتقان كارىۋاتقا بېرىپتۇ - دە، ئۇنى بىر يالماپلا يۇتۇۋېتىپتۇ. ئاندىن ئۇنىڭ كۆڭلەك ۋە باشنىكىنى كىيىپ، كارىۋاتقا چىقىپ جىممىدە يېتىۋاپتۇ. .\n       ئەمدى قىزىل بۆككە كېلەيلى. ئۇ تەرەپ - تەرەپكە چېپىپ بىر قۇچاق گۈل تېرىپتۇ. گۈللەر ئۇنىڭ قۇچىقىغا پاتماي قالغاندىلا، ئۇ ئاندىن مومىسىنى يادىغا ئاپتۇ. ئۇ يول- غا چىقىپ مومىسىنىڭ ئۆيىگە راۋان بوپتۇ. مومىسىنىڭ ئۆيىگە كېلىپ ئىشىكنىڭ ئوچۇق تۇرغانلىقىنى كۆرۈپ ھەيران بوپتۇ. ئۆينىڭ ئىچىگە كىرىپمۇ سەل غەلىتىلىك ھېس قىپتۇ. ئۇ： «توۋا، بۈگۈن ئەجەب يۈرىكىم ئېغىپ تۇرىدۇيا، ئىلگىرى مومامنىڭكىگە كەلسەم كۆڭلۈم يايراپ كېتىدىغان» دەپ ئويلاپتۇ - دە: \n      ＿ موما، قانداق ئەھۋالىڭىز؟ _ دەپ سوراپتۇ.\n            جاۋاب بولماپتۇ. قىزىل بۆك كارىۋاتنىڭ يېنىغا كېلىپ  قارىسا، مومىسى كارىۋاتتا باشنىكىنى چۆكۈرۈپ كىيىپ ياتقۇدەك. ئۇنىڭ يۈزىنىمۇ كۆرگىلى بولمايدىكەن.\n      _ ئەي موما، قۇلىقىڭىز نېمانداق چوڭ؟ _ دەپ سوراپتۇ قىزىل بۆك.        _ چوڭ بولسا گېپىڭنى تېخىمۇ ئېنىقراق ئاڭلايمەن - دە، _ دەپ جاۋاب بېرىپتۇ بۆرە.       _ ئەي موما، كۆزىڭىز نېمانچە يوغان؟      _ چوڭ بولسا سېنى ئوچۇق كۆرەلەيمەن.      _ ئەي موما، قولىڭىز نېمانداق يوغان؟      _ چوڭ بولسا سېنى موككىدە تۇتالايمەن.   _موما، ئاغزىڭىز نېمىشقا ئادەمنىڭ قورققۇسى كەلگۈدەك يوغان؟      _ چوڭ بولسا سېنى يالماپ يۇتالايمەن، _ بۆرە شۇنداق دەپلا كارىۋاتتىن سەكرەپ چۈشۈپتۇ - دە، قىزىل بۆكنى ھاپلا قىلىپ يۇتۇۋېتىپتۇ.       بۆرە قورسىقىنى تويدۇرغاندىن كېيىن، كارىۋاتتا خورەك تارتىپ خاتىرجەم ئۇخلاشقا باشلاپتۇ. دەل شۇ چاغدا ئۆينىڭ ئالدىدىن بىر ئوۋچى ئۆتۈپ قاپتۇ. ئۇ ئۆي ئىچىدىن چىقىۋاتقان خورەكنى ئاڭلاپ: «موماي خورەككە چۈشۈپتۇ، قاراپ باقايچۇ؟ ئۇ ئاغرىپ قالغان بولمىسۇن يەنە» دەپ ئويلاپ ئۆيگە كىرىپتۇ ۋە كارىۋاتنىڭ ئالدىغا بېرىپ بۆرىنى كۆرۈپ قاپتۇ.\n     _ ۋۇي، ئىبلىس بۆرە، مەن سېنى ئىزدەپ يۈرەتتىم، ئەمدىغۇ قولۇمغا چۈشكەنسەن، _ ئوۋچى شۇنداق دەپلا بۆرىنى قارىغا ئاپتۇ. قارىغا ئاپتۇيۇ، توختاپ قاپتۇ، چۈنكى ئۇ بۆرە موماينى يۇتۇۋەتكەن ئوخشايدۇ، مەن ئۇنى قۇتۇلدۇراي دەپ ئويلىغانىكەن. شۇنىڭ بىلەن ئۇ قولىغا قايچا ئېلىپ بۆرىنىڭ قارنىنى شۇنداق يېرىپتىكەن، ئىچىدىن قىزىل بۆكلۈك بىر قىز سەكرەپ چىقىپتۇ. \n       _  ئەجەبمۇ قورقتۇما، بۆرىنىڭ قورسىقى بەكلا قاراڭغۇ بولىدىكەن ئەمەسمۇ ！     ئۇنىڭ كەينىدىنلا تۇنجۇقۇپ ئۆلگىلى تاس قالغان مومىسى چىقىپتۇ. قىزىل بۆك يۈگۈرۈپ تالاغا چىقىپ بىر- مۇنچە تاش ئەكىرىپتۇ - دە، بۆرىنىڭ قارنىغا تىقىپ توش- قۇزۇپ قويۇپتۇ. بۆرە ئويغىنىپ قاچماقچى بوپتىكەن، تاش- نىڭ ئېغىرلىقىدىن مىدىر - سىدىر قىلالماي، غىققىدە جېنى چىقىپ كېتىپتۇ.\n      ئۇلار شاد - خۇراملىققا چۆمۈپتۇ. ئوۋچى بۆرىنىڭ تې- رىسىنى ئېلىپ ئۆيىگە قايتىپتۇ. مومىسى قىزىل بۆك ئە- كېلىپ بەرگەن نەرسىلەرنى يەپ - ئىچىپ ماغدۇرىغا كى- رىپتۇ. قىزىل بۆكمۇ ئىچىدە: «ئاپام مېنى يولدىن چەتنەپ ئورمانغا يالغۇز كىرمە دېگەنىدى، ئەمدى ھەرگىزمۇ ئورمانغا كىرمىسەم بولغۇدەك» دەپ ئويلاپتۇ.  \nكىلەركى مەزمۇنىمىزدا: «ئورماندىكى كەپە» دىگەن چۆچەكدىن بەھرىمان بۇلىمىز .ھارمىغايسىلەر! ! ! \n有个可爱的小女孩，总戴着一顶红帽子，大家都叫她小红帽。\n一天，妈妈让小红帽提着蛋糕和红酒，去看望生病的外婆，叮嘱她千万别离开大路，不要和陌生人说话。\n小红帽走进森林，碰到了大灰狼。她天真地告诉大灰狼自己要去外婆家。大灰狼骗她去林中采漂亮的野花，自己抢先跑到外婆家，伪装成小红帽，骗开房门，一口吞下外婆，躺在床上假扮外婆。\n小红帽采完花来到小屋，走到床边，觉得十分奇怪。“外婆，你的耳朵为什么这么大？”“为了听清你的声音。”“外婆，你的眼睛为什么这么大？”“为了看清你的模样。”“外婆，你的手为什么这么大？”“为了抱住你。”“外婆，你的嘴巴怎么这么大？”\n大灰狼猛地扑过来，一口吃掉了小红帽。很快，吃饱的狼躺在床上沉沉睡去。\n路过的猎人发现了大灰狼，小心地剪开狼的肚子，救出了外婆和小红帽。三人找来大石头填满狼的肚子。狼醒后动弹不得，最后死掉了。\n小红帽明白了道理：不能随便相信陌生人，不能离开安全的道路。",

      "desc": "بۇرۇنقى زاماندا نامرات بىر ئوتۇنچى ئۆتكەنىكەن. ئۇ ئايالى، ئۈچ قىزى بىلەن ئورماندىكى بىر كەپىدە ياشايدى- كەن. بىر كۈنى ئۇ ئوتۇنغا ماڭغۇچە ئايالىغا：\n -چۈشلۈك تامىقىمنى چوڭ قىزىم ئورمانغا ئاپىرىپ بەرسۇن، بولمىسا ئىشىم ئاقساپ قالىدۇ، مەن يول بويى تې- رىق چېچىپ ماڭىمەن، ئۇ شۇنى بويلاپ ماڭسا مېنى تاپالاي- دۇ، _ دەپتۇ.  \nكۈن نەيزە بويى ئۆرلىگەندە، چوڭ قىز بىر كوزا شور- پىنى كۆتۈرۈپ يولغا چىقىپتۇ. شۇغىنىسى، ئورماندىكى قۇشلار يەرگە چېچىقلىق تېرىقنى تېرىپ يەۋالغاچقا، قىز يولدىن ئادىشىپ كېتىپتۇ. \nقىز بېشى قايغان، پۇتى تايغان تەرەپكە قاراپ مېڭىپتۇ، مېڭىپتۇ، كۈن ئولتۇرۇپ قاراڭغۇ چۈشۈپتۇ. ئورماندىكى دەرەخلەر شىلدىرلاپ، ھۇۋقۇش ھۇۋلاشقا باشلاپتۇ. قورققى- نىدىن قىزنىڭ جېنى چىقايلا دەپ قاپتۇ. شۇ ئەسنادا ئۇنىڭ كۆزىگە يىراق بىر يەردە پىلدىرلاپ يېنىۋاتقان ئوت كۆرۈ- نۈپتۇ. «ئوت كۆرۈنگەن يەردە چوقۇم ئادەم بار، مەن شۇلار- نىڭ قېشىغا بېرىپ تۈنەي» دەپ ئويلاپتۇ قىز ۋە شۇ تەرەپكە  قاراپ مېڭىپ بىر ئۆينىڭ ئالدىغا كېلىپ قاپتۇ. قىزچاق ئىشىكنى چېكىپتۇ، ئۆينىڭ ئىچىدىن «كىرىڭ！» دېگەن قوپال بىر ئاۋاز ئاڭلىنىپتۇ. قىزچاق قاراڭغۇ دالانغا كى- رىپ، ساراينىڭ ئىشىكىنى چېكىپتىكەن، «ئۇدۇل كىرىۋې- رىڭ» دەپتۇ يەنە ھېلىقى ئاۋاز. قىزچاق ئۆيگە كىرىپ شۇنداق قارىسا، ئاپئاق ساقاللىرى يەرگە تېگەي دەپ قالغان بىر بوۋاي قوللىرى بىلەن ئېڭىكىنى تىرەپ ئولتۇرغۇدەك. ئوچاقنىڭ ئالدىدا بىر مېكىيان، بىر خوراز ۋە بىر تاغىل سىيىر ياتقۇدەك.\n قىزچاق بوۋايغا كەچۈرمىشلىرىنى سۆزلەپ بېرىپ ئۇنىڭدىن ئۆيىدە بىر كېچە قونۇپ كېتىشنى ئىلتىماس قىپتۇ. بوۋاي ھېلىقى ھايۋانلاردىن سوراپتۇ：\n ئەي چىرايلىق مېكىيان، رەڭدار تونلۇق خورازچاق. ئېيتقىنچۇ تاغىل سىيىر، ئۆيدە قونسۇنمۇ قىزچاق؟\n ھايۋانلار تەڭلا： «دوكىس！» دەپ جاۋاب بېرىپتۇ. بۇ سۆز «قوشۇلىمىز！» دېگەن مەنىنى بىلدۈرىدىكەن.\n _ ئۆيىمىزدە نەرسە - كېرەكلەر مولچىلىق. سەن تالا- دىكى ئوچاقتا بىزگە تاماق ئېتىپ بەرگىن، _ دەپتۇ بوۋاي.  \nقىزچاق بۇ يەردە تاماققا كېرەكلىك خۇرۇچلارنىڭ راستتىنلا موللۇقىنى كۆرۈپ، ئوخشىتىپ تاماق ئېتىپتۇ. ئەمما، ئۇ ھېلىقى ھايۋانلارنىڭ ئاچ - توقلۇقىنى خىيالى- غىمۇ كەلتۈرمەپتۇ. ئۇ ئۆزىگە بىر قاچا ئاشنى ئۇسۇپتۇ- دە، ئاپئاق ساقاللىق بوۋاينىڭ يېنىدا ئولتۇرۇپ، تويۇپ كې- كىرگۈچە يەپتۇ. ئاندىن ئۇ：\n — ھېرىپ كەتتىم، يېتىپ ئۇخلىغۇدەك كارىۋات بار - مۇ؟ _ دەپ سوراپتۇ. ھايۋانلار: \nيېدىڭ - ئىچتىڭ، بەتنىيەت، ئۆز قارنىڭنى توقلىدىڭ. ئەمدى نەدە ياتارسەن؟ بىزنى ئويلاپ قويمىدىڭ. \nدەپ جاۋاب بېرىپتۇ. \n-ئۈستۈنكى قەۋەتتىكى ئۆيگە ئىككى كارىۋات قويۇل- غان. سەن چىقىپ كارىۋاتلارنى قېقىشتۇرۇپ، پاكىز كىر- لىكلەرنى سال. مەنمۇ چىقىپ ئۇخلايمەن، _ دەپتۇ بوۋاي.\n  قىزچاق ئۆيگە چىقىپ كارىۋاتلارنى قېقىپ - سۈپۈ- رۈپ، پاكىز كىرلىكلەرنى ساپتۇ. ئاندىن بوۋاينىڭ چىقىشى- نى كۈتمەيلا كارىۋاتقا چىقىپ ئۇيقۇغا كېتىپتۇ. بىردەمدىن كېيىن بوۋاي چىقىپتۇ. ئۇ قولىدىكى چىراغنى يېقىن ئە-كېلىپ قىزغا قاراپتۇ - دە، ئۇنىڭ ئۇخلاپ قالغانلىقىنى كۆرۈپ بېشىنى چايقاپ قويۇپتۇ. ئاندىن گەمىنىڭ قاپقىقىنى ئېچىپلا قىزنى گەمىگە تاشلىۋېتىپتۇ. \nئوتۇنچى ئۆيىگە ناھايىتى كەچ قايتىپتۇ ۋە پۈتۈن بىر كۈن ئاچ قويغانلىقى ئۈچۈن خوتۇنىغا كايىپتۇ.\n _ ۋاي، ياق، _ دەپتۇ خوتۇنى، _ سىزگە تاماقنى چوڭ قىزىمىز ئەكەتكەن. ئۇ يولدىن ئېزىپ قالغان ئوخشاي- دۇ، ئەتە قايتىپ كېلىپ قالار. \nئەتىسى تاڭ يورۇمايلا ئوتۇنچى يەنە ئوتۇنغا مېڭىپتۇ. ئۇ ئايالىغا بۈگۈن تاماقنى ئوتتۇرانچى قىزىدىن ئەۋەتىشنى تاپىلاپتۇ.\n -بۈگۈن مەن يول بويى يېسسىمۇق چېچىپ ماڭاي، _ دەپتۇ ئۇ، _ چۈنكى يېسىمۇق تېرىقتىن چوڭراق، كۆزگە ئاسان چېلىقىدۇ. ئوتتۇرانچى قىزىمىز شۇ يېسىمۇقلارغا قاراپ ماڭسا چوقۇم ئېزىپ قالمايدۇ.\n چۈش بولغاندا ئوتتۇرانچى قىز تاماقنى كۆتۈرۈپ يولغا چىقىپتۇ. ئەمما، ئۇنىڭغا يېسسىمۇقلاردىن بىر تالمۇ ئۇچ- رىماپتۇ. چۈنكى، قۇشلار ئۇلارنىڭمۇ بىر تېلىنى قويماي تېرىپ يەپ بولغانىكەن. شۇڭا، ئوتتۇرانچى قىزمۇ ئېزىپ قاپتۇ. كەچ كىرگەندە ئۇمۇ ھېلىقى بوۋاينىڭ ئۆيىگە كەپتۇ. بوۋاي ئۇنى ئۆيگە كىرگۈزۈپتۇ. ئۇمۇ بوۋايدىن يېگۈدەك نەرسە بىلەن ياتقۇدەك جاي سوراپتۇ. ئاپئاق ساقال بوۋاي يەنە ھېلىقى ھايۋانلاردىن سوراپتۇ：  \nئەي چىرايلىق مېكىيان، رەڭدار تونلۇق خورازچاق. ئېيتقىنچۇ تاغىل سىيىر، ئۆيدە قونسۇنمۇ قىزچاق؟\nدوكىس ！ _ دەپ جاۋاب بېرىپتۇ ھايۋانلار. \nبۇ قىزمۇ تاماقنى ئاچىسىغا ئوخشاش ئوخشىتىپ ئې- تىپتۇ ۋە ھېلىقى ئۈچ بىچارىگە بەرمەيلا بوۋاي بىلەن ئول- تۇرۇپ موكۇلدىتىپ سوقۇپتۇ. ئاندىن يېتىش ئۈچۈن. جاي سوراپتۇ. ھايۋانلار:\n _   يېدىڭ - ئىچتىڭ، بەتنىيەت، ئۆز قارنىڭنى توقلىدىڭ. ئەمدى نەدە ياتارسەن؟ بىزنى ئويلاپ قويمىدىڭ. \nدەپ جاۋاب بېرىپتۇ. \nبۇ قىزچاقمۇ ئۈستۈنكى قەۋەتتىكى ئۆيگە چىقىپ ئا- چىسىغا ئوخشاشلا ئۇخلاپ قاپتۇ. بوۋاي يەنە بېشىنى چاي- قاپتۇ - دە، بۇ قىزنىمۇ گەمىگە تاشلىۋېتىپتۇ. \nئۈچىنچى كۈنى ئەتىگەندە، ئوتۇنچى ئايالىغا： \n بۈگۈن ماڭا تاماقنى كەنجى قىزىمىز ئاپىرىپ بەر-سۇن. ئۇنىڭ ئەزەلدىن قۇلىقى يۇمشاق، كۆڭلى ياخشى. ئۇ ئاچىلىرىغا ئوخشاش داپ داراڭشىغان، ئېشەك ھاڭرىغان يەر- لەردە قاڭقىپ يۈرمەيدۇ، مېنىڭ يېنىمغا تېنىمەي بارالاي- دۇ، _ دەپتۇ. \n_ ئەمدى مۇشۇ ئەڭ ئارزۇلۇق بالىمىزدىنمۇ ئايرىلىپ قالاي دەمسىز؟ _ دەپ ئۇنىماپتۇ ئايالى.\n _ خاتىرجەم بول، خوتۇن، بۇ قىزىمىز بەكمۇ چېچەن، ئۇ ھەرگىزمۇ ئېزىپ كەتمەيدۇ. مەن بۈگۈن يولغا نوقۇت چېچىپ ماڭاي. نوقۇت يېسسىمۇقتىن چوڭراق، كۆزگىمۇ ئوڭاي چېلىقىدۇ. \nكەنجى قىز بىلىكىگە تاماق سېلىنغان سېۋەتنى ئېسىپ يولغا چىقىپتۇ. بۇ چاغدا ئورماندىكى كەپتەرلەر نوقۇتتىن بىرىنىمۇ قويماي پاك - پاكىز تېرىپ يەپ بولغانىكەن. كەنجى قىز قانداق مېڭىشىنى بىلەلمەي گاڭگىراپ قاپتۇ. «بىچارە دادام ئاچ قالىدىغان بولدى، ئۆيگە كېتەلمىسەم ئاق كۆڭۈل ئاپام ئازابلىنىدۇ، ئەمدى قانداق قىلارمەن؟» دەپ ئۇنىڭ تازا بېشى قېتىپتۇ. كەچمۇ كىرىپتۇ. قىزغا يىراقتا ئوت كۆرۈنۈپتۇ. ئۇ پىلدىرلاۋاتقان يورۇققا قاراپ مېڭىپ ھېلىقى ئۆينىڭ ئالدىغا كېلىپ قاپتۇ. ئۇ ئاپئاق ساقال بوۋايغا ئەدەپ بىلەن سالام بېرىپ، بىر كېچە قونۇش ئۈچۈن ئىجازەت سوراپتۇ. ئاپئاق ساقال بوۋاي يەنە:\n ئەي چىرايلىق مېكىيان، رەڭدار تونلۇق خورازچاق.ئېيتقىنچۇ تاغىل سىيىر، ئۆيدە قونسۇنمۇ قىزچاق؟  دەپ ھايۋانلىرىدىن سوراپتۇ.  \n-دوكىس！-دەپ جاۋاب بېرىپتۇ ئۇلار.\nقىزچاق دەرھال ئوچاق بېشىغا ئۆتۈپ خوراز بىلەن مې- كىياننىڭ پارقىراپ تۇرغان پەيلىرىنى سىلاپتۇ. ئالا سىيىر- نىڭ مۈڭگۈزىدىن ئاستا تۇتۇپ ئۇنىڭ پېشانىسىنى سىلاپ قويۇپتۇ. ئۇ بوۋاينىڭ تاپشۇرمىسى بويىچە تەملىك شورپا قىپتۇ. ئۇ بىر قاچا شورپىنى جوزىغا قويۇپلا： «توۋا، مەن ئۆزۈمنىڭ قورسىقى بىلەنلا بولۇپ كېتىپ، بۇ ئاق كۆڭۈل ھايۋانلارنى ئاچ قويغىلى تاس قاپتىمەن ! تالادا شۇنچە جىق نەرسە بولغاندىكىن، مەن دەسلەپ بۇلارنىڭ قورسىقىنى توقلاي» دەپ ئويلاپتۇ. \nئۇ چىقىپ ئارپا ئەكىرىپ مېكىيان بىلەن خورازنىڭ ئالدىغا چېچىپتۇ، بىر قۇچاق ئوت ئەكىرىپ سىيىرغا سې- لىپ بېرىپ：\n _ سۆيۈملۈك ھايۋانلار، تويغۇچە يەڭلار، ئۇسسىساڭلار سۈپسۈزۈك سۇ ئەكىرىپ بېرىمەن، _ دەپتۇ. \nئۇ لىق بىر چېلەك سۇ ئەكىرىپتۇ. مېكىيان بىلەن خوراز چېلەكنىڭ قىرىغا قونۇپ سۇنى قانغۇچە ئىچىپتۇ. تاغىل سىيىرمۇ ئۇسسۇزلۇقىنى قاندۇرۇپتۇ. ئۇ ھايۋانلارنى بېقىپ بولغاندىن كېيىن، ئۈستەلگە كېلىپ ئولتۇرۇپ بوۋاي ئاشۇرۇپ قويغان شورپىنى ئىچىشكە باشلاپتۇ. ئۇزۇن ئۆتمەي مېكىيان بىلەن خوراز بېشىنى قاناتلىرىنىڭ ئىچىگە تىقىپ  مۈگدەشكە باشلاپتۇ. تاغىل سىيىرنىڭمۇ كۆزلىرى يۇمۇلۇپ كېتىپتۇ. \n_ ئەمدى ئۇخلىساق بولار، _ دەپتۇ قىز ۋە ئۈچىدىن سوراپتۇ：  \nئەي چىرايلىق مېكىيان، رەڭدار تونلۇق خورازچاق. ئېيتقىنچۇ تاغىل سىيىر، بولارمۇ ئەمدى ئۇخلىساق؟\nھايۋانلار جاۋاب بېرىپتۇ: \n بوغۇز بەردىڭ يېگىلى، سۇ بەردىڭ سەن ئىچكىلى. بېشىمىزنى سىلىدىڭ، راھەتلىنىپ ئۇخلىغىن.\n  كەنجى قىز ئۈستۈنكى قەۋەتتىكى ئۆيگە چىقىپ مامۇق ياستۇقلارنى قېقىپ، كارىۋاتقا ئاپئاق كىرلىكلەرنى ساپتۇ. ھەممە ئىشنى جاي - جايىدا تۈگىتىپتۇ. ئاندىن بوۋاي ئاپ- ئاق ساقاللىرىنى ساڭگىلىتىپ كارىۋاتقا چىقىپ يېتىپتۇ. كەنجى قىزمۇ يەنە بىر كارىۋاتقا يېتىپلا ئۇخلاپ كېتىپتۇ. كەنجى قىز يېرىم كېچىگىچە خاتىرجەم ئۇخلاپتۇ، يې- رىم كېچىدىن كېيىن ئۆيدىكى تاراق - تۇرۇقتىن ئويغىنىپ كېتىپتۇ： ئۆينىڭ بۇلۇڭلىرىدىن غەلىتە ئاۋازلار ئاڭلىنىپ- تۇ، ئىشىك تاراقشىپ ئېچىلغىنىچە تامغا ئۇرۇلۇپتۇ. تام- تورۇسلار ئۆرۈلۈۋاتقاندەك، پەلەمپەيلەر غۇلاۋاتقاندەك قاراس- قۇرۇس ئاۋازلار ئاڭلىنىپتۇ. ئاندىن گۈلدۈر قىلغان ئاۋاز بىلەن تەڭ خۇددى تورۇس گۈمۈرۈلۈپ چۈشكەندەك سادا چى- قىپتۇ - دە، ئۆينىڭ ئىچى تىمتاس بولۇپ كېتىپتۇ. كەنجى قىزنىڭ ھېچ يېرى يارىلانماپتۇ، ئەكسىچە، ئۇ جىمجىت يات- قان پېتى يەنە ئۇيقۇغا كېتىپتۇ. \nئەتىسى ئەتىگەندە قۇياش ئۆزىنىڭ ئالتۇندەك نۇرىنى چېچىپ قىزنى ئۇيقۇدىن ئويغىتىپتۇ. قىز ئويغىنىپ نېمى- نى كۆرۈپتۇ دېمەمسىلەر؟ ئەيبۇھەنناس، ئۇ ئاجايىپ - غارا- يىپ بېزەلگەن ھەشەمەتلىك بىر سارايدا ياتقۇدەك. ئەتراپىدى- كى ھەممە نەرسە كۆزىنىڭ يېغىنى يېگۈدەك دەرىجىدە ۋال - ۋۇل قىلىپ چاقناپ تۇرغۇدەك. ساراينىڭ تاملىرى يېشىل مەخمەل بىلەن قاپلانغان بولۇپ، ئۈستىگە ئالتۇندىن گۈل چېكىلگەنىكەن. پىل چىشىدىن ياسالغان كارىۋاتنىڭ ئۈس- تىدىكى قىپقىزىل مامۇق يوتقانلار ئوتقاشتەك تاۋلىنىدىكەن. كارىۋاتنىڭ يېنىدىكى ئورۇندۇقتا مەرۋايىتتىن توقۇلغان كەش تۇرغۇدەك. كەنجى قىز ئوڭۇممۇ، چۈشۈممۇ، دەپ ھاڭ - تاڭ بولۇپ قاپتۇ. شۇ ئەسنادا رەتلىك كىيىنگەن ئۈچ دېدەك كىرىپتۇ - دە، ئۇنىڭ ئالدىدا قول باغلاپ تۇرۇپتۇ. \n_ بولدى قايتىڭلار، _ دەپتۇ قىز ئۇلارغا، _ مەن ھازىرلا تۇرۇپ بوۋايغا شورپا قاينىتىمەن. چىرايلىق مېكى- يان، خوراز ۋە تاغىل سىيىرلارغا يەم بېرىمەن. \nئۇ بوۋاي بۇ چاغقا تۇرغاندۇر، دەپ ئويلاپ ياندىكى كارىۋاتقا قاراپتۇ - دە، ئۇنىڭدا ئاپئاق ساقاللىق بوۋاي ئە-مەس، بەلكى ياپياش، چىرايلىق بىر يىگىتنىڭ ياتقانلىقىنى كۆرۈپتۇ. دەل شۇ پەيتتە يىگىت ئويغىنىپ دەپتۇ：\n _ مەن ئەسلىي شاھزادە ئىدىم، قارانىيەت جادۇگەر موماي مېنى ئاپئاق ساقاللىق بوۋايغا ئايلاندۇرۇپ، ئاشۇ قې- لىن ئورمانغا بەند قىلىۋەتكەنىدى. خورازغا، مېكىيانغا ۋە تاغىل سىيىرغا ئايلاندۇرۇۋېتىلگەن ئۈچ خىزمەتكارىمدىن باشقا ھېچكىم ماڭا يېقىن كېلىشكە جۈرئەت قىلالمايتتى. پەقەت ئادەمزاتقىلا ئەمەس، ھايۋانلارغىمۇ كۆيۈنىدىغان، ئۇلارنىڭ ھالىغا يېتىدىغان بىرەر ئاق كۆڭۈل قىز بىز تۇر- غان يەرگە كەلگەندىلا، جادۇگەرنىڭ جادۇسى كاردىن چىقات- تى. ئۇ قىز دەل سىز ئىدىڭىز. تۈنۈگۈن يېرىم كېچىدىن كېيىن سىز بىزنى جادۇدىن ئازاد قىلدىڭىز، قەدىمكى ئور- ماندىكى بۇ كەپە يېڭىۋاشتىن سەلتەنەتلىك ئوردىغا ئايلاندى. ئۇلار ئورۇنلىرىدىن تۇرۇپتۇ. شاھزادە دەرھال خىزمەت- كارلىرىنى مەپىنى قېتىپ بېرىپ قىزنىڭ ئاتا - ئانىسىنى تويغا چىللاپ كېلىشكە بۇيرۇپتۇ. \n_ مېنىڭ ئاچىلىرىم قېنى؟ _ دەپ سوراپتۇ كەنجى قىز.\n _ مەن ئۇلارنى گەمىگە سولاپ قويدۇم. ئەتە ئۇلارنى ئورمانغا ئاپىرىپ ياغاچكۆمۈر كۆيدۈرۈشكە سالماقچىمەن. قاچانكى ئۇلار خاتالىقىنى تونۇپ، ھايۋانلارنى ئاچ قويمايدىغان ھالغا كېلىدىكەن، شۇ چاغدا ئۇلارنى قايتۇرۇپ كېلىمەن، — دەپتۇ شاھزادە.   \nبۈگۈنكى چۆچىكىمىز مۇشۇيەردە ئاخىرلاشتى كىلەركى مەزمۇنىمىزدا: « بۆرە بىلان ئوغلاقلار » دىگەن چۆچەكدىن بەھرىمان بۇلىمىز .ھارمىغايسىلەر! ! ! \n从前有个樵夫，他有三个女儿。一天，他让大女儿送饭到森林，沿路撒小米做标记，但鸟儿把小米吃光了，大女儿迷了路。\n天黑时，她找到一座小屋，屋里有一个白胡子老人和三只动物：母鸡、公鸡和花牛。她借宿做饭，却只顾自己和老人吃喝，完全不管动物。夜里，她被老人扔进了地窖。\n第二天，二女儿送饭，撒的扁豆也被鸟吃光。她做了同样自私的事，也被扔进地窖。\n第三天，小女儿送饭，撒的豌豆同样被鸟吃掉。她也迷路来到小屋。但她先温柔地抚摸动物，做饭时先喂饱它们，最后才自己吃。夜里小屋发出巨响，但她安然入睡。\n第二天醒来，小屋变成了宏伟的宫殿，老人变成了一位英俊的王子。原来王子被女巫施了魔法，只有对人和动物都善良的人才能解救他。王子娶了小女儿，两个自私的姐姐则被送去当烧炭工，直到学会善待动物。",

      "desc": "بۇرۇننىڭ بۇرۇنىسىدا بىر قېرى ئۆچكە ئۆتكەنىكەن. ئۇنىڭ جېنىدىنمۇ ئەزىز كۆرىدىغان يەتتە ئوغلى بار ئىكەن. بىر كۈنى ئۇ ئورمانغا بېرىپ يېگۈدەك بىرنەرسە تېپىپ كەلمەكچى بوپتۇ. ئۇ يولغا چىقىش ئالدىدا ئوغلاقلىرىغا：\n\n _ جېنىم بالىلىرىم، مەن ئورمانغا كېتىۋاتىمەن، سى- لەر بۆرىدىن ئېھتىيات قىلىڭلار. ناۋادا بۆرە ئۆيگە كىرىۋال- سا سىلەرنى يەۋېتىدۇ. ئۇ ھەر خىل قىياپەتلەرگە كىرىۋېلىپ باشقىلارنى ئالدايدۇ. لېكىن، سىلەر ئۇنىڭ قوپال ئاۋازى بىلەن قاپقارا پۇتىغا قاراپلا بۆرە ئىكەنلىكىنى بىلىۋالالايسىلەر، _ دەپتۇ.\n\n\n _ سۆيۈملۈك ئاپا، بىز چوقۇم ئېھتىيات قىلىمىز، سىز خاتىرجەم كېتىۋېرىڭ، _ دەپتۇ ئوغلاقلار. \n\nقېرى ئۆچكە خاتىرجەم بولۇپ يولىغا راۋان بوپتۇ. ئارىدىن ئۇزۇن ئۆتمەي بىرى ئىشىكنى قېقىپ: \n\n_ ئوماق بالىلىرىم، ئىشىكنى ئېچىڭلار، مەن كەلدىم، سىلەرگە ياخشى نەرسە ئەكەلدىم، _ دەپتۇ.\n\n ئەمما، ئوغلاقلار ئۇنىڭ قوپال ئاۋازىنى ئاڭلاپلا بۆرە ئىكەنلىكىنى بىلىۋاپتۇ.  \n\n_ سەن بىزنىڭ ئاپىمىز ئەمەس، ساڭا ئىشىكنى ئاچ- مايمىز. ئاپىمىزنىڭ ئاۋازى شۇنداق مۇلايىم، يېقىملىق، سېنىڭكىدەك قوپال ئەمەس، سەن دېگەن بۆرە، _ دەپتۇ  \n\nبۆرە يۈگۈرگىنىچە بېرىپ سودىگەردىن ئازراق زاماسكا سېتىۋاپتۇ - دە، ئۇنى يەپ ئاۋازىنى خېلى سىلىقلاشتۇرۇپتۇ، ئاندىن كېلىپ يەنە ئىشىكنى قېقىپتۇ: \n\n_ ئوغلاقلىرىم، ئىشىكنى ئېچىڭلار، مەن كەلدىم، سى- لەرگە ياخشى نەرسە ئەكەلدىم.\n\n ئەمما، ئوغلاقلار ئۇنىڭ دېرىزە تەكچىسىگە ئېلىۋالغان قاپقارا پۇتلىرىغا قاراپلا： \n\n_ ياق، ئىشىكنى ئاچمايمىز، ئاپىمىزنىڭ پۇتى سې- نىڭكىدەك قارا ئەمەس، سەن دېگەن بۆرە، _ دەپتۇ. \n\nبۆرە يۈگۈرگىنىچە بولكىچىنىڭ يېنىغا بېرىپ：\n\n _ پۇتۇم سۈرۈلۈپ قاناپ كەتتى. ئازراق خېمىر چاپلاپ قويساڭ، _ دەپتىكەن، بولكىچى ماقۇل بولۇپ، ئۇنىڭ پۇتىغا ئازراق خېمىر چاپلاپ قويۇپتۇ. \n\nيەنە تۈگمەنچىنىڭ يېنىغا بېرىپ： \n\n_ پۇتۇمغا ئازراق - ئۇن سېپىپ قويساڭ، _ دەپتۇ. ئۇ- نىڭ باشقىلارنى ئالدىماقچى بولۇۋاتقانلىقىنى سەزگەن تۈگمەنچى ئۇنىماپتۇ.\n\n_ سەپمەي باقە قېنى، قوۋۇرغىلىرىڭنى چايناپ پۈر- كۈۋەتمەيدىغان بولسام، _ دەپ ھۆركىرەپتۇ بۆرە. \n\nتۈگمەنچى قورقۇپ كېتىپتۇ ۋە ئۇنىڭ پۇتىنى ئۇن سېپىپ ئاقارتىپ قويۇپتۇ. \n\nشۇنىڭ بىلەن ئالدامچى بۆرە ئوغلاقلارنىڭ ئىشىكىنى يەنە قېقىپتۇ:\n\n _ ئوماق ئوغلاقلىرىم، ئىشىكنى ئېچىڭلار، مەن كەل- دىم، ئورماندىن ياخشى نەرسە ئەكەلدىم.\n\n _ پۇتۇڭنى بىزگە كۆرسىتىپ باق، سەن ئاپىمىزمۇ، ئەمەسمۇ شۇنىڭغا قاراپ بىلىۋالايلى، _ دەپتۇ ئوغلاقلار. \n\nبۆرە پۇتىنى دېرىزە تەكچىسىگە ئاپتۇ. ئوغلاقلار ئۇنىڭ پۇتىنىڭ ئاپئاقلىقىنى كۆرۈپ ئاپىمىز كەپتۇ، دەپ ئويلاپتۇ - دە، ئىشىكنى ئېچىپ ساپتۇ. لېكىن، ئىشىكتىن ئاپىسى ئەمەس، بەلكى بۆرە كىرىپ كەپتۇ. قورقۇپ كەتكەن ئوغلاقلار جېنىنى قۇتقۇزۇش ئۈچۈن ئۆزلىرىنى تەرەپ - تەرەپكە ئېتىشىپتۇ. بىرى ئۈستەلنىڭ ئاستىغا كىرىۋاپتۇ، يەنە بىرى كارىۋاتقا چىقىۋاپتۇ، ئۈچىنچى ئوغلاق ئوچاقنىڭ ئىچىگە مۆكۈنۈپتۇ، تۆتىنچى ئوغلاق ئاشخانىغا كىرىۋاپتۇ، بەشىنچىسى ئىشكاپنىڭ تۆپىسىگە چىقىۋالسا، ئالتىنچىسى كىر يۇيىدىغان داسنىڭ ئاستىغا كىرىۋاپتۇ، يەتتىنچى ئوغلاق بولسا، تام سائىتىنىڭ قېپىغا يوشۇرۇنۇپتۇ. لېكىن، بۆرە ئۇلارغا قىلچىمۇ رەھىم قىلماي ھەممىسىنى يالماپ يۇتۇپتۇ. بۆرە سائەتنىڭ قېپىغا كىرىۋالغان ئەڭ كىچىك ئوغلاقنى كۆرمەي قالغاچقا، پەقەت شۇلا ئامان قاپتۇ. بۆرە قورسىقىنى تويغۇزغاندىن كېيىن ئۆيدىن چىقىپ بىر دەرەخنىڭ سايىسىدە ئۇيقۇغا كېتىپتۇ.\n\n ھايال ئۆتمەي ئانا ئۆچكە ئورماندىن قايتىپتۇ. ئۇ ئۆيگە كىرىپلا نېمىلەرنى كۆرۈپتۇ دېمەمسىلەر؟ ئىشىك داغدام ئوچۇق تۇرغۇدەك. ئۈستەل - ئورۇندۇقلار يەردە قالايمىقان ياتقۇدەك. كىر يۇيىدىغان داسمۇ تېشىلىپ كەتكەن، كارىۋاتتىكى ياستۇق، ئورۇن - كۆرپىلەر ھەريان چېچىلغان. ئۇ يەتتە بالىسىنى ئىزدەپ ھەممە بۇلۇڭ - پۇچقاقلارنى ئاختۇرۇپ چىقىپتۇ، لېكىن تاپالماپتۇ. ئۇ ئوغلاقلىرىنىڭ ئىسمىنى نۆۋەت بىلەن چاقىرىپ بېقىپتۇ، لېكىن ھېچ يەردىن سادا كەلمەپتۇ. ئاخىردا ئۇ ئەڭ كىچىك ئوغلىقىنىڭ ئىسمىنى چاقىرىپتىكەن. \n\n«جېنىم ئاپا، مەن سائەت قېپىنىڭ ئىچىدە» دېگەن ئاۋاز ئارانلا ئاڭلىنىپتۇ. \n\nئانا ئۆچكە ئۇنى سائەت قېپىدىن ئېلىپ يەرگە قويۇپتۇ. ئەڭ كىچىك ئوغلاق ئاپىسىغا، بۆرىنىڭ قانداق كىرگەن- لىكىنى، بىر تۇغقانلىرىنى قانداق يەۋەتكەنلىكىنى ئېقىت- ماي - تېمىتماي سۆزلەپ بېرىپتۇ. سىلەر ئانا ئۆچكىنىڭ بالىلىرىنىڭ دەردىدە قانچىلىك يىغلاپ - قاقشىغىنىنى ئېيتمىساقمۇ بىلىۋالالايسىلەر. \n\nئۇ زار - زار يىغلىغىنىچە سىرتقا قاراپ مېڭىپتۇ، ئەڭ كىچىك ئوغلاقمۇ ئۇنىڭدىن ئايرىلماي كەينىدىن يۈگۈرۈپتۇ. ئۇلار ئوتلاققا كېلىپ، بۆرىنىڭ بىر دەرەخنىڭ سايىسىدە ئۇخلاۋاتقانلىقىنى، ئۇنىڭ تارتقان خورىكىدىن دەرەخمۇ لىڭشىپ كېتىۋاتقانلىقىنى كۆرۈپتۇ. ئانا ئۆچكە بۆرىگە تازا سىنچىلاپ قارىسا، بۆرىنىڭ قورسىقى مىدىرلاپ تۇرغۇدەك.  \n\n«بۆرىگە كەچلىك غىزا بولغان بىچارە بالىلىرىم تېخى تىرىكمۇ نېمە؟» دەپ ئويلاپتۇ ئانا ئۆچكە.\n\n ئوغلاق يۈگۈرگىنىچە ئۆيگە بېرىپ قايچا، يىپ - يىڭنە ئېلىپ كەپتۇ. ئانا ئۆچكە ۋەھشىي بۆرىنىڭ قورسىقىنى يې- رىشىغا بىر ئوغلاق. بېشىنى لىپپىدە چىقىرىپتۇ. بۆرىنىڭ قورسىقىنى تېخىمۇ چوڭراق كېسىپتىكەن، ئىلگىرى - ئاخىر بولۇپ ئالتە ئوغلاق كەينى - كەينىدىن سەكرەپ چى- قىپتۇ، چىققاندىمۇ ساق - سالامەت چىقىپتۇ. چۈنكى، ئېچىرقاپ كەتكەن ئاچ كۆز بۆرە ئۇلارنى چاينىمايلا يۇتۇۋەتكەنىكەن. ئوغلاقلار مېھرىبان ئاپىسىنى قۇچاقلاپ سۆيۈپ، خۇددى بايرام بولغاندەك خۇشاللىققا چۆمۈپتۇ.\n\n _ بالىلىرىم، چاپسان بېرىپ تاش تېرىپ كېلىڭلار. بۇ  ئەبلەخ ئۇخلاۋاتقان چاغدىن پايدىلىنىپ قورسىقىنى تاش بىلەن توشقۇزۇۋېتەيلى، _ دەپتۇ ئانا ئۆچكە.\n\n يەتتە ئوغلاق قىيغىتقىنىچە بېرىپ نۇرغۇن تاش تېرىپ كەپتۇ - دە، بۆرىنىڭ قورسىقىغا پېتىشىچە تىقىپتۇ. ئاندىن ئانا ئۆچكە بۆرىنىڭ قورسىقىنى تىكىۋېتىپتۇ. بۆرە شۇ چاغقىچە ھېچنېمىنى تۇيماي بەخىرامان ئۇخلاۋېرىپتۇ.\n\n بۆرىنىڭ ئۇيقۇسى قېنىپ ئويغىنىپتۇ. ئۇ ئۇسساپ كې- تىپ سۇ ئىچكىلى قۇدۇق بېشىغا بېرىپتۇ. ئۇ ھەر بىر قەدەم ئالغاندا، قورسىقىدىكى تاشلار بىر - بىرىگە ئۇرۇ- لۇپ شاراق - شۇرۇق ئاۋاز چىقىرىدىكەن. بۇنىڭدىن ھەيران بولغان بۆرە دەپتۇ：\n\n قورسىقىمدا نېمىدۇر، \nشاراق - شۇرۇق قىلىدۇ. \nيېگىنىم ئوغلاق دېسەم، \nھەممىسى تاش ئىكەنغۇ ！ \n\nئۇ قۇدۇقنىڭ ئاغزىغا كەپتۇ ۋە سۇ ئىچمەكچى بولۇپ شۇنداق ئېڭىشىپتىكەن، قورسىقىدىكى تاشنىڭ سالمىقى بېسىپ كېتىپ، پولتۇڭڭىدە قىلىپ قۇدۇققا چۈشۈپ كې- تىپتۇ. بۇنى كۆرگەن ئوغلاقلار «بۆرە ئۆلدى ! خوپ بولدى!» دەپ چاۋاك چېلىپ سەكرىشىپتۇ ۋە ئانىسى بىلەن بىللە قۇدۇقنى چۆرگىلەپ ئۇسسۇل ئويناشقا باشلاپتۇ.  \n\n\n\nبۈگۈنكى چۆچىكىمىز مۇشۇيەردە ئاخىرلاشتى كىلەركى مەزمۇنىمىزدا: « برېمېن شەھرىنىڭ سازەندىلىرى » دىگەن چۆچەكدىن بەھرىمان بۇلىمىز .ھارمىغايسىلەر! ! ! \n\n\n狼和七只小山羊\n\n\n从前有只老山羊，她生了七只小山羊，并且像所有母亲爱孩子一样爱它们。一天，它要到森林里去取饲料，于是把七只小山羊都叫过来，对它们说：“亲爱的孩子们，我要到森林里去，你们千万要提防狼。要是让它进了屋，它会把你们连皮带毛通通吃掉的。这个坏蛋常常伪装成别的样子，但是，你们一听它那粗哑的声音，一看它那黑色的脚爪，就能认出它来。”小山羊们说：“好妈妈，我们会当心的，你放心去吧。”老山羊咩咩地叫了几声，便放心地走了。\n\n没过多久，有人敲门，并且喊道：“开门哪，我的好孩子，你们的妈妈回来了，还给你们每个人带了一点东西来。”可是小山羊们一听那粗哑的声音，就知道是狼。“我们不开门，”它们叫道，“你不是我们的妈妈。我们的妈妈声音又细又好听，你的声音却这么粗哑，你是狼！”\n\n于是狼跑到杂货商那里，买了一大块白垩土，吃下去使自己的声音变细了。然后它回来又敲敲门，喊道：“开门哪，我的好孩子，你们的妈妈回来了，给你们每个人都带了点东西来。”可是狼把它的黑爪子搁在了窗台上，小山羊们看见了，便叫道：“我们不开门，我们的妈妈没有你这样的黑脚爪，你是狼！”\n\n于是狼跑到面包师那里，说：“我的脚碰伤了，给我涂点生面团吧。”面包师给它涂上面团后，它又跑到磨坊主那里，说：“给我的脚撒上点白面粉吧。”磨坊主心想：“这狼准是想骗人。”便拒绝了它的要求。可是狼说：“你要是不给我撒，我就把你吃掉！”磨坊主害怕了，只好把它的脚弄成了白色。是啊，人就是这个样子。\n\n现在，这个坏蛋第三次来到小山羊的家门口，敲敲门说：“给我开门哪，孩子们，你们亲爱的妈妈回来了，从森林里给你们每个人都带了一点东西来了。”小山羊们叫道：“先把你的脚伸给我们看看，好让我们知道你是不是我们亲爱的妈妈。”狼把脚伸进窗户，它们看见脚是白色的，便相信它说的是真话，把门打开了。可是进来的是谁呢，正是那只狼！小山羊们吓坏了，想躲起来。第一只跳到桌子底下，第二只跳到床上，第三只跳进炉灶里，第四只跑进厨房，第五只钻进柜子里，第六只藏到洗衣盆下面，第七只藏进了挂钟的钟壳里。但是狼把它们一个个都找了出来，毫不客气地把它们一个一个吞进了喉咙里。只有最小的那只藏在钟壳里的小山羊，没有被狼发现。\n\n狼吃饱以后，便溜走了，来到外面的一块草地上，躺在一棵大树下，开始呼呼大睡起来。\n\n没过多久，老山羊从森林里回来了。啊，它看到了怎样一幅景象啊！房门大敞着，桌子、椅子和凳子都东倒西歪，洗衣盆摔成了碎片，被子和枕头从床上拖到了地上。它找它的孩子们，可是到处都找不见。它挨个叫着它们的名字，可是没有人答应。最后，当它叫到最小的那只时，一个细细的声音传了出来：“亲爱的妈妈，我藏在钟壳里呢。”老山羊把它抱出来，它向妈妈讲述了狼来过了，并且把其他所有的小山羊都吃掉了。你们可以想象，老山羊为它那些可怜的孩子哭得多么伤心啊！\n\n老山羊痛哭着走了出去，最小的山羊也跟着跑了出去。它们来到草地上，看见狼正躺在大树底下打鼾，鼾声响得连树枝都摇动起来。老山羊仔细地打量着它，发现它那鼓鼓的肚子里有什么东西在蠕动、在折腾。“天哪，”它想，“难道我那些被它当作晚餐吞下去的可怜孩子们还活着吗？”于是小山羊连忙跑回家，拿来了剪刀、针和线。老山羊剪开那怪物的大肚皮，刚剪了一刀，就有一只小山羊探出了头；它继续剪下去，六只小山羊便一个个跳了出来，而且全都活着，没有受到一点伤害，因为那怪物太贪婪了，把它们囫囵吞了下去。这真是让人高兴啊！它们拥抱着亲爱的妈妈，高兴得又蹦又跳，就像裁缝举行婚礼那样。\n\n老山羊却说：“现在你们去找些大石头来，趁这坏蛋还在睡觉，我们把它的肚子填满石头。”于是七只小山羊飞快地搬来了许多石头，把石头塞进狼的肚子里，能塞多少就塞多少。然后老山羊又飞快地把狼的肚皮缝了起来。狼一点也没有察觉，连动都没动一下。\n\n狼终于睡醒了，站起身，因为肚子里的石头让它口渴得要命，所以它想到井边去喝水。它刚迈步走，肚子里的石头就互相碰撞，发出咣当咣当的响声。它叫道：\n\n“什么东西在我肚子里\n咣当咣当地响？\n我以为是六只小羊，\n可听起来全是石头样。”\n\n它走到井边，弯腰想喝水，沉重的石头把它拽了下去，它掉进了深深的井里，悲惨地淹死了。七只小山羊看见了，便跑过来，大声喊道：“狼死了！狼死了！”它们高兴地和妈妈一起围着水井跳起舞来。",

      "desc": "بۇرۇنقى زاماندا بىر ئېشەك بولغانىكەن. ئۇ ئېشەك ھاردىم - ئاچتىم دېمەي، تاغار - تاغار ئۈگۈتنى تۈگمەنگە ئاپىرىپ تارتىپ كېلىدىكەن. نەدە ئېغىر ئىش بولسا، شۇنى قىلىدىكەن. شۇنداق قىلىپ يۈرۈپ ئايلار ئۆتۈپتۇ، ئېشەكمۇ يىلسايىن ماغدۇرىدىن كېتىپتۇ. ئاخىرىغا بېرىپ ئىگىسىگە ئەسقاتمايدىغان ھالغا چۈشۈپ قاپتۇ. ئىگىسى ئۇنى ئېغىلدىن ھەيدەپ چىقىپ ئۆلتۈرۈۋەتمەكچى بوپتۇ. بۇنىڭ شەپىسىنى سېزىپ قالغان ئېشەك برېمېن شەھىرىگە قېچىپ بېرىپ سازەندە بولماقچى بوپتۇ. ئۇ مېڭىپ - مېڭىپ بىر يەرگە كەلگەندە، يولدا ئەسنەپ ياتقان بىر تايغانغا يولۇقۇپتۇ. تايغان چارچاپ ھالىدىن كەتكەنىكەن.\n\n _ تايغان ئاداش، نېمىشقا ئەسنەپ ياتىسەن؟ _ دەپ سوراپتۇ ئېشەك.\n\n\n _ گەپ قىلما، ئېشەكباي، _ دەپتۇ تايغان ھەسرەت بىلەن، _ قېرىدىم - چىرىدىم، كۈچۈمدىن قېلىپ ئوۋغا يارىماس بولۇپ قالدىم. ئىگەم مېنى ئۇرۇپ ئۆلتۈرۈۋەتمەكچى بولۇۋىدى، ئۆيدىن قېچىپ چىقتىم. ئەمدى جېنىمنى قانداق بېقىشنى بىلمەي بېشىم قېتىپ مۇشۇنداق ئەسنەپ يېتىپتىمەن.\n\n _ ماڭا قارا، _ دەپتۇ ئېشەك، _ مەن برېمېن شەھىرىگە بېرىپ سازەندە بولماقچى. يۈر مەن بىلەن، سەنمۇ سازەندە بولغىن. مەن چالغۇ چالاي، سەن ناغرا چال. \n\nتايغان ماقۇل بولۇپ ئۇنىڭ كەينىدىن مېڭىپتۇ. ئانچە ئۇزۇن ماڭماي ئۇلارغا يول بويىدا غەمگە چۆكۈپ ئولتۇرغان بىر مۈشۈك ئۇچراپتۇ. \n\n-مۈشۈكباي، سېنىڭ بېشىڭغا قانداق كۈن چۈشتى؟ _ دەپ سوراپتۇ ئېشەك.\n\n _ ھاياتىم قىلنىڭ ئۈستىدە تۇرغاندا كۆڭلۈمگە نېمە سىغسۇن؟ يېشىم بىر يەرگە بېرىپ، چىشلىرىم گاللىشىپ قالغاچقا چاشقان تۇتالمايدىغان، ئەتىدىن كەچكىچە ئوچاقنىڭ يېنىدا خورەك تارتىپ ئۇخلايدىغان بولۇپ قالغانىدىم. ئۆي ئىگىسى ئايال مېنى تۇنجۇقتۇرۇپ ئۆلتۈرۈۋەتمەكچى بولدى. قېچىپ چىقىشنىغۇ قېچىپ چىقتىم. بىراق نەگە بېرىپ، نەدە تۇرۇشۇمنى بىلەلمەي بېشىم قېتىۋاتىدۇ، _ دەپتۇ مۈشۈك ئۇلۇغ - كىچىك تىنىپ. \n\n_ بىز بىلەن بىرگە برېمېن شەھىرىگە بېرىپ سازەندە بولغىن. سەن كېچىسى ساز چالالايسەن ئەمەسمۇ. \n\nمۈشۈك بۇ مەسلىھەتنى لايىق تېپىپ ئۇلارغا قېتىلىپ مېڭىپتۇ، جان بېقىش ئۈچۈن ئۆز يۇرتلىرىدىن ئايرىلغان بۇ ئۈچ مۇساپىر يولدا بىر جاڭزىنىڭ ئالدىدىن ئۆتۈپتۇ. قارىسا، بىر خوراز جېنىنىڭ بارىچە چىللاۋاتقۇدەك. \n_ نېمانداق ئادەمنىڭ قورققۇسى كەلگۈدەك چىلايسەن؟— دەپ سوراپتۇ ئېشەك. \n\n_ ئەتە يەكشەنبە كۈنى ئۆيگە مېھمان كەلمەكچى. باغرى تاش ئايال خوجايىن مېنى مېھمانلارغا شورپا قىلىپ بەرمەكچى بولۇۋېتىپتۇ. ئۇ مېنى ئۆلتۈرۈشكە ئاشپەز خوتۇننى  بۇيرۇدى. ئاشپەز خوتۇن بۈگۈن ئاخشام كاللامنى ئالىدۇ. شۇڭا، ئۆلۈش ئالدىدا قانغۇچە چىللىۋالاي دەيمەن، _ دەپتۇ خوراز. \n\n_ ھەي قىزىل تاج، شۇمۇ گەپ بولدىمۇ؟ بىز بىلەن بىللە برېمېن شەھىرىگە بار. ئۇ يەردە ئۆلۈمدىن ئەۋزەلرەك بىر يول تېپىلىپ قالار. سېنىڭ ئاۋازىڭ ياخشى، بىز بىلەن بىللە ئويۇن قويساڭ تازا قاملىشىدۇ، _ دەپتۇ ئېشەك. \n\nبۇ گەپ خورازغا خوپ يېقىپتۇ. شۇنىڭ بىلەن تۆتى يولغا راۋان بوپتۇ. \n\nبرېمېن شەھىرى يىراق ئىكەن. ئۇلار ھەرقانچە تېز ماڭسىمۇ ئۇ يەرگە شۇ كۈنىلا يېتىپ بارالمايدىكەن. شۇڭا، ئۇلار ئورماندا تۈنىمەكچى بوپتۇ. ئېشەك بىلەن تايغان بىر تۈپ دەرەخنىڭ ئاستىدا يېتىپتۇ. مۈشۈك دەرەخنىڭ ئاچى- مىقىغا چىقىۋاپتۇ. خوراز ئەڭ بىخەتەر، دەپ دەرەخنىڭ ئۇچىغا چىقىپ يېتىپتۇ. ئۇلار ئۇخلاشتىن ئىلگىرى خوراز ئەتراپنى كۆزىتىپ يىراقتا پىلدىرلاۋاتقان ئوتنى كۆرۈپتۇ - دە، ئەتراپتا ئۆي بار ئىكەنلىكىدىن ھەمراھلىرىنى خەۋەردار قىپتۇ. \n\n_ ئەمىسە، بىز شۇ يەرگە بېرىپ تۈنەيلى، بۇ جايىمىز تازا ئەپلەشمىدى، _ دەپتۇ ئېشەك. ئۇ يەردە ئاز - تولا گۆشى بار سۆڭەك ئۇچراپ قالسا ئەجەب ئەمەس، دەپ ئويلاپ- تۇ تايغان ۋە ئۇ يەرگە بېرىشقا چىن كۆڭلىدىن رازى بوپتۇ. شۇنىڭ بىلەن ئۇلار ئوت كۆرۈنۈۋاتقان يەرگە قاراپ مېڭىپتۇ. ئوت ئۇلارغا بارغانسېرى يورۇق كۆرۈنۈشكە باشلاپتۇ . ئاخىر ئۇلار چىراغ يېنىپ تۇرغان بىر ئۆيگە كېلىپ قاپتۇ . ئۆيدە قاراقچىلار بار ئىكەن . ئېشەك ھەممىسىدىن ئېگىز بولغاچقا ، ئۆيگە دېرىزىدىن ماراپتۇ .\n\n _ ئېشەك ، نېمىنى كۆردۇڭ ؟  _ دەپ سوراپتۇ خوراز .\n\n  _ نېمىنى كۆردۈڭ دەمسىنا ؟  _ دەپتۇ ئېشەك ،  _ ئۈستەلگە ھەر خىل ياخشى تائاملار بىلەن ئېسىل ھاراقلار توشۇپ كېتىپتۇ ، قاراقچىلار ھەدەپ قورساق تويدۇرۇش بىلەن ئاۋارە .\n\n _  شۇ نەرسىلەرنىڭ ھەممىسى بىزنىڭ بولسىچۇ  ،  _ دەپتۇ خوراز .\n\n _ ئوھوي ، راست ، راست دەيسەن ، بىزمۇ ئاشۇ داستىخانغا داخىل بولساق ھە،  _ دەپتۇ ئېشەك .\n\n ئۇلار قاراقچىلارنى قانداق قىلىپ قوغلىۋېتىش ھەققىدە مەسلىھەتكە چۈشۈپتۇ ، ئاخىر ياخشى بىر چارە ئويلاپ تې - پىپتۇ : ئېشەك ئالدىنقى پۇتلىرىنى دېرىزە تەكچىسىگە قويىدىغان ، تايغان ئېشەكنىڭ دۈمبىسىگە ، مۈشۈك تايغاننىڭ دۈمبىسىگە چىقىدىغان ، خوراز مۈشۈكنىڭ بېشىغا قونىدىغان بوپتۇ . ئۇلار تەييارلىقنى پۈتتۈرگەندىن كېيىن بىرلا بەلگە بىلەن تەڭ نېمە ئىش قىپتۇ دېمەمسىلەر ؟ ئېشەك ھاڭراپتۇ ، مۈشۈك مىياڭلاپتۇ ، خوراز چىللاپتۇ ، تايغان قاۋاپتۇ . ئۇلار ئاشۇنداق شاۋقۇن  - سۈرەن بىلەن دېرىزىنىڭ ئەينەكلىرىنى جاراڭشىتىپ سۇندۇرۇپ ئۆيگە باستۇرۇپ كىرىپتۇ . بۇ ئاۋازلاردىن قورقۇپ يۈرىكى يېرىلىپ كەتكىلى تاس قالغان قاراقچىلار جىن  - ئالۋاستىلار كەلگەن ئوخشايدۇ ، دەپ ئۆلەر  - تىرىلىشىگە باقماي ئورمانغا قاراپ قېچىپتۇ . شۇنىڭ بىلەن بۇ تۆت ھەمراھ داستىخاندا ئولتۇرۇپ ، نازۇنېمەتلەرنى خۇددى بىرەر ئاي ئاچ قالغاندەك ئىشتىھا بىلەن يېيىشكە باشلاپتۇ . \n\nتۆت سازەندە قورساقلىرىنى توقلىغاندىن كېيىن چىراغنى ئۆچۈرۈپتۇ  - دە ، ھەرقايسىسى ئۆگەنگەن خۇيى بو - يىچە ئۆزىگە ئەپلىك جاينى تېپىپ تاتلىق ئۇيقۇغا كېتىپتۇ . ئېشەك قىغ دۆۋىسىنىڭ تۆپىسىدە ، تايغان ئىشىكنىڭ كەينىدە ، مۈشۈك ئوچاقتىكى ئىسسىق كۈلنىڭ ئۈستىدە ، خوراز لەمپىدە يېتىپ شېرىن چۈشلىرىنى باشلاپتۇ . چۈنكى ، ئۇلار نۇرغۇن يول يۈرۈپ ھېرىپ كەتكەن  - دە .\n\n يېرىم كېچىدىن ئاشقاندا قاراقچىلار ئۆينىڭ قاراڭغۇ ھەم تىنپتىنچ تۇرغانلىقىنى بايقاپ قاپتۇ .\n\n _ ئەمدى قورقمىساقمۇ بولغۇدەك ،  _ دەپتۇ قاراق - چىلارنىڭ باشلىقى ۋە بىر قاراقچىنى بېرىپ ئەھۋال ئىگىلەپ كېلىشكە ئەۋەتىپتۇ . قاراقچى ئۆينىڭ يېنىغا كەپتۇ ، ھېچ - قانداق سادانىڭ يوقلۇقىغا قاراپ خاتىرجەم بوپتۇ . ئاندىن چىراغنى ياندۇرماقچى بولۇپ ئاشخانىغا كىرىپتۇ  - دە ، مۈشۈكنىڭ قاراڭغۇدا پارقىراپ تۇرغان كۆزىنى چوغ دەپ ئويلاپ ، قولىدىكى گۈڭگۈرتنى ئۇنىڭغا شۇنداق تەگكۈزۈپتىكەن ، چاقچاق بىلەن ئېپى كېلىشمەيدىغان مۈشۈك ئېتىلىپلا ئۇنىڭ يۈزىنى مورلاپ قىيما  - چىيما قىلىۋېتىپتۇ . قاراقچى بەكمۇ قورقۇپ كېتىپتۇ . ئۇ ئارقا ئىشىكتىن قېچىپ چىقىپ كەتمەكچى بوپتىكەن . ئىشىكنىڭ كەينىدە ياتقان تايغان كاپلا قىلىپ ئۇنىڭ پۇتىدىن ئاپتۇ . ئۇ ئالمان  - تالمان قېچىپ ھويلىغا چىقىپتىكەن ، قىغنىڭ تۆپىسىدە ياتقان ئېشەك ئۇنى كېلىشتۈرۈپ بىرنى تېپىپتۇ . بۇ گۈلدۈر - غاراستىن ئويغىنىپ كەتكەن خوراز  « قى  - قى  - قىق » قىلىپ بار ئاۋازى بىلەن چىللاپتۇ .\n\n قاراقچى قورقۇنچتا ئالدى  - كەينىگە قارىماي قېچىپتۇ ۋە بېرىپ باشلىقىغا :  \n\n_ يارەببىم ، ئۇ يەردە بەكمۇ ياۋۇز بىر جادۇگەر بار ئىكەن ئەمەسمۇ ، ئۇ پىشقىرغىنىچە ماڭا ئېتىلىپ ، ئۇزۇن تىرناقلىرى بىلەن مورلاپ يۈزۈمنى تىتىۋەتتى . ئىشىك تۈۋىدە تۇرغان بىرى پاچىقىمغا پىچاق سالدى ؛ ھويلىدا ياتقان قاپقارا غەلىتە بىر مەخلۇق توقماق بىلەن بېشىمغا ئۇردى ؛ ئۆگزىدە ياتقان بىر سوتچى ：  « بۇ خۇنپەرنى دەرھال تۇتۇڭلار » دەپ توۋلىدى . شۇنىڭ بىلەن مەن ئالدى  - كەينىمگە قارىماي قېچىپ كەلدىم ،  _ دەپتۇ .\n\n شۇنىڭدىن ئېتىبارەن قاراقچىلار ئۇ ئۆيگە دەسسەشكە جۈرئەت قىلالماپتۇ . برېمېن شەھىرىنىڭ تۆت سازەندىسى باشقا ھېچ يەرگە بارماي شۇ يەردە خۇشال  - خۇرام ياشاپتۇ . ئۇلارنىڭ ئىچىدە ھەممىدىن ئۇزاق ياشاپ ،كىشىلەرگە بۇ چۆچەكنى ئېيتىپ بەرگىنى تېخى ھاياتمىش .\n\nبۈگۈنكى چۆچىكىمىز مۇشۇيەردە ئاخىرلاشتى كىلەركى مەزمۇنىمىزدا: « ئەتىرگۈل مەلىكە » دىگەن چۆچەكدىن بەھرىمان بۇلىمىز .ھارمىغايسىلەر! ! ! \n\n\n\n从前有一头驴，它每天驮麦子去磨坊，干了很多年重活。后来它老了，没力气了，主人就想把它杀掉。驴发现不对劲，就偷偷逃走了。它想去不莱梅城当个乐师。\n\n走了一会儿，驴在路上遇到一条猎狗，狗正趴在地上喘粗气。驴问：\"狗老弟，你怎么啦？\"狗说：\"我老了，打不了猎了，主人要打死我，我就逃出来了。可我不知道去哪儿好。\"驴说：\"跟我去不莱梅当乐师吧！我弹琴，你打鼓。\"狗很高兴，就跟驴走了。\n\n走着走着，它们看见路边蹲着一只猫，愁眉苦脸的。驴问：\"猫老弟，你怎么啦？\"猫说：\"我老了，抓不动老鼠了，女主人要淹死我，我逃出来了，可不知道去哪儿。\"驴说：\"跟我们一起去不莱梅当乐师吧！你会夜间音乐。\"猫觉得不错，就跟它们走了。\n\n三个伙伴路过一个院子，看见一只公鸡站在大门上拼命叫。驴问：\"公鸡老弟，你怎么叫得这么响？\"公鸡说：\"明天来客人，女主人要把我炖成鸡汤！厨娘今晚就要砍我的头，我趁现在还活着，使劲叫几声。\"驴说：\"跟我们去不莱梅吧！你嗓子这么好，跟我们一起演出准热闹！\"公鸡高兴地答应了。于是四个好朋友一起上路了。\n\n他们走了一天，天黑了，还没到不莱梅，只好在树林里过夜。驴和狗躺在大树下，猫爬到树枝上，公鸡飞到最高的树顶上。公鸡往四周一看，发现远处有灯光，就叫起来：\"那边有房子！\"驴说：\"我们去那儿过夜吧！\"大家就往亮光处走去。\n\n原来那是一座房子，里面住着一群强盗，正围着一桌好吃好喝的大吃大喝呢！四个伙伴馋坏了，可怎么才能进去呢？它们想了个好主意：驴把前蹄搭在窗台上，狗跳到驴背上，猫爬到狗身上，公鸡飞到猫头上。然后它们一起大叫起来——\n\n驴\"唔昂唔昂\"地吼，狗\"汪汪汪\"地叫，猫\"喵呜喵呜\"地喊，公鸡\"喔喔喔\"地啼。窗玻璃哗啦啦全碎了！强盗们听见这可怕的怪声，以为妖怪来了，吓得拔腿就跑，全逃进树林里去了。\n\n四个伙伴这才跳进屋里，围着桌子饱饱地吃了一顿。吃饱后，它们各自找地方睡觉：驴睡在草堆上，狗睡在门后面，猫蜷在暖暖的灶台边，公鸡飞到了房梁上。\n\n半夜里，强盗头子派一个小强盗回来看情况。小强盗悄悄摸进厨房，黑漆漆的，他看见两团亮光——那是猫的眼睛！他以为是炭火，划了根火柴凑过去。猫\"喵\"地扑上去，把他的脸抓花了！小强盗吓得往后门跑，门后的狗跳起来咬住他的腿。他连滚带爬逃到院子里，驴又狠狠踢了他一脚。公鸡也在房梁上\"喔喔喔\"地大叫，好像在喊：\"抓住他！抓住他！\"\n\n小强盗没命地跑回去，哆哆嗦嗦地说：\"那屋里有个可怕的女巫抓我的脸，门口有人拿刀砍我的腿，院子里有个大怪物用棍子打我，屋顶上还有个法官在喊抓人！太可怕了！\"\n\n从那以后，强盗们再也不敢回那座房子了。四个乐师就高高兴兴地住下来，再也不去不莱梅了。它们一直快快乐乐地生活在一起。\n\n据说，它们中间最长寿的那位，到现在还活着呢——因为它把这个故事讲给了所有人听呀！",

      "desc": "بۇرۇننىڭ بۇرۇنىسىدا بىر پادىشاھ بىلەن خانىش ئۆتكە- نىكەن. ئۇلار پەرزەنتسىزلىك ئوتىدا ئۆرتىنىدىكەن، ئۇلار ئولتۇرسا-قويسا پەرزەنتلىك بولۇشنىڭ غېمىدە ئىكەن. بىر كۈنى خانىش يۇيۇنۇۋاتسا، سۇدىن بىر پاقا چىقىپ شۇنداق دەپتۇ：\n\n _ نەچچە ۋاقىتتىن بېرى تىلىگەن تىلىكىڭلارغا يېتى- دىغان بولدۇڭلار. بىر يىلغا قالماي سىز بىر قىز تۇغىسىز. \n\n\nپاقىنىڭ دېگىنى راست بولۇپ چىقىپتۇ. خانىش ئاي دېسە ئاي ئەمەس، كۈن دېسە كۈن ئەمەس چىرايلىق بىر قىز تۇغۇپتۇ. پادىشاھ خۇشاللىقىدىن قىلىدىغانغا قىلىق تاپالماي قاپتۇ - دە، قىزى ئۈچۈن كاتتا زىياپەت ئۆتكۈزۈپ بەرمەك- چى بوپتۇ. ئۇ بۇ زىياپەتكە ئۇرۇق - تۇغقان، ئەل - ئاغىنى- لىرىنى چاقىرتىپلا قالماي، قىزىمغا ياخشى تىلەكلەرنى تى- لىسۇن دەپ ھۆكۈما ئاياللارنىمۇ چاقىرىپتۇ. بۇ ئەلدە ھۆكۈما ئايالدىن ئون ئۈچى بار ئىكەن. لېكىن، ئوردىدا ئۇلارغا تاماق بەرگۈدەك ئالتۇن تاۋاقتىن ئاران ئون ئىككى- سى بار ئىكەن. شۇڭا، پادىشاھ ھۆكۈما ئاياللارنىڭ ئون ئىككىسىنى چاقىرىپ، بىرىنى ئايرىپ قويۇشقا مەجبۇر بوپتۇ.\n\nكاتتا زىياپەت باشلىنىپتۇ. زىياپەت ئاخىرلىشاي دېگەن- دە، ئايال ھۆكۈمالار قىزچاققا كىشىنىڭ خىيالىغىمۇ كەل- مەيدىغان ئېسىل سوۋغاتلارنى سوۋغا قىلىشقا باشلاپتۇ： بىرىنچى ئايال ئۇنىڭغا ئەدەپ - ئەخلاقنى سوۋغا قىپتۇ. ئىككىنچىسى گۈزەللىكنى، ئۈچىنچىسى تۈگىمەس بايلىقنى، قالغانلىرى كىشىلەر ئارمان قىلىدىغان، ئەمما يېتەلمەيدىغان نەرسىلەرنى سوۋغا قىپتۇ. ئون بىرىنچى ھۆكۈما ئايال بوۋاقنى مۇبارەكلەپ تۇرۇشىغا، ئون ئۈچىنچى ھۆكۈما ئايال ئوردىغا شاپاشلاپ كىرىپ كەپتۇ. ئۇ پادىشاھنىڭ ئۆزىنى قاتاردىن چۈشۈرۈپ قويغىنى ئۈچۈن ئۆچ ئالماق بولۇپ كەل- گەنىكەن. ئۇ ئۇيان - بۇيان قارىماي، ھېچكىمگىمۇ گەپ قىلماي، ئۇدۇل كەلگىنىچە زىياپەت زالىنىڭ ئوتتۇرىسىدا توختاپ ۋارقىراپتۇ： \n\n_ مەلىكە ئون بەش ياشقا كىرگەندە، ئۇرچۇققا تېگىپ يىقىلىپ ئۆلىدۇ ! \n\nئۇ سۆزىنى تۈگىتىپلا ئالدى - كەينىگە قارىماي غۇيۇلداپ چىقىپ كېتىپتۇ. بۇ چاغدا بوۋاقنى مۇبارەكلەشكە ئۈلگۈرمىگەن ئون ئىككىنچى ھۆكۈما ئايال ئوتتۇرىغا چى- قىپتۇ. ئۇ بايىقى ھۆكۈما ئايالنىڭ جادۇسىنى يوق قىلىۋې- تەلمەيدىكەن، ئەمما ئۇنى سەل ئاجىزلاشتۇرالايدىكەن.\n\n _ مەلىكە يىقىلىپ چۈشۈپ ئۆلمەيدۇ، ئەمما شۇ يى- قىلغىنىچە يۈز يىل ئۇخلايدۇ، _ دەپتۇ ئۇ. \n\nپادىشاھ جېنىدىنمۇ ئارتۇق كۆرىدىغان قىزىنىڭ پېشكەللىككە ئۇچرىشىدىن ئەنسىرەپ، دۆلەتتىكى ئۇرچۇقلارنىڭ ھەممىسىنى يىغىپ كۆيدۈرۈۋېتىڭلار، دەپ پەرمان چۈشۈرۈپتۇ. ئايال ھۆكۈمالارنىڭ قىلغان سوۋغاتلىرى مەلىكىنىڭ جىسمىغا مۇجەسسەم بولۇپ ئۆز كارامىتىنى كۆرسىتىشكە باشلاپتۇ： ئۇ شۇنچىلىك ساھىبجا- مال، ئەقىللىق، مۇلايىم ۋە ئەدەپ - ئەخلاقلىق چوڭ بوپتۇ. شۇڭا، ئۇنىڭغا ھەممە ئادەم ئامراق ئىكەن.\n\n ئۇ دەل ئون بەش ياشقا كىرگەن كۈنى، پادىشاھ بىلەن خانىش سىرتقا چىقىپ كېتىپ ئوردىدا مەلىكە يالغۇز قاپتۇ. ئۇ زېرىكىپ كېتىپ ئوردىنى ئۆزى يالغۇز ئارىلاشقا باشلاپ- تۇ. توساتتىن قەدىمكى بىر قوڭغۇراق راۋىقىنىڭ يېنىغا كېلىپ قاپتۇ - دە، ئايلانما پەلەمپەي بىلەن راۋاقنىڭ ئۈس- تىگە چىقىپ، بىر كىچىك ئىشىكنىڭ ئالدىغا كەپتۇ. مەلى- كە قارىسا ئىشىككە داتلىشىپ كەتكەن بىر قۇلۇپ سېلىنغان بولۇپ، ئاچقۇچ قۇلۇپنىڭ تۆشۈكىدە تۇرغۇدەك. قىز ئاچ-  \nقۇچنى تولغاپتىكەن، كىچىك ئىشىك ئېچىلىپتۇ. مەلىكە ئۆينىڭ ئىچىگە كىرىپتۇ. ئۇ يەردە بىر موماي يىپ ئېگىرىپ ئولتۇرغۇدەك. \n\nموما، قانداق ئەھۋالىڭىز، بۇ يەردە نېمە ئىش قىلىپ ئولتۇرىسىز؟ _ دەپ سوراپتۇ مەلىكە.\n\n＿ يىپ ئېگېرىۋاتىمەن، قىزىم — دەپتۇ موماي.\n\n ___ قانداق نەرسە بۇ، ئەجەپ قىزىق چۆرگىلەيدىكىنا؟ _ دەپتۇ مەلىكە ۋە ئۇرچۇقنى ئېلىپ يىپ ئېگىرمەكچى بوپتۇ. \n\nئۇ قولىنى ئۇرچۇققا تەگكۈزۈشىگە جادۇ ئۆز كارامىتىنى كۆرسىتىپتۇ، ئۇرچۇق مەلىكىنىڭ قولىنى تېشىۋېتىپتۇ. \n\nمەلىكە شۇ يەردىكى كارىۋاتقا يىقىلغان پېتى ئۇيقۇغا كېتىپتۇ. بۇ ئۇيقۇ پۈتۈن ئوردىدىكىلەرگە يۇقۇپتۇ. پادىشاھ بىلەن خانىش ئوردىغا قايتىپ كېلىپ تەختتە ئولتۇرۇشىغا ئۇيقۇ بېسىپ ئۇخلاپ قاپتۇ. باشقا ئادەملەرمۇ ئۇلارغا ئوخشاشلا قىسمەتكە ئۇچراپتۇ. ئېغىلدىكى ئات، ھويلىدىكى ئىت، ئۆگزىدىكى كەپتەر، تامدىكى چىۋىنلاردىن تارتىپ ئوچاقتا كۆيۈۋاتقان ئوتقىچە قاتتىق ئۇيقۇغا كېتىپتۇ. قازاندىكى مايدا پاژىلداپ قورۇلۇۋاتقان گۆشمۇ قورۇلۇشتىن توختاپتۇ. ئاشخانىدىكى بىر بالا خاتا ئىش قىلىپ قويغانىكەن، ئاشپەز ئۇنىڭ چېچىدىن ئالماقچى بولۇپ قولىنى كۆ تۈرگەن پېتى ئۇخلاپ قاپتۇ. چىقىۋاتقان شامالمۇ توختاپ دەرەخ يۇپۇرماقلىرى تىمتاسلىققا چۈمۈپتۇ.\n\nئوردىنىڭ ئەتراپىدا ئەتىرگۈل ئۆسۈپ كېتىپتۇ. ئوردىنى چۆرىدەپ ئەتىرگۈل قاشاسى ھاسىل بوپتۇ. بۇ ئەتىرگۈل- لەر يىلدىن - يىلغا ئاينىپ، ئاخىر ئوردا كۆرۈنمىگۈدەك دەرىجىدە ئېگىزلەپتۇ. ھەتتا ئۆگزىدىكى بايراقمۇ كۆرۈنمەي قاپتۇ. شۇنىڭ بىلەن بۇ ئەلدە ئۇيقۇدا ياتقان گۈزەل ئەتىر- گۈل مەلىكە (پۇقرالار مەلىكىنى شۇنداق ئاتىشىدىكەن) توغرىسىدىكى ئاجايىپ رىۋايەت ئېغىزدىن ئېغىزغا كۆچۈپ \nيۈرىدىغان بوپتۇ. بۇ يەرگە تەرەپ - تەرەپتىن شاھزادىلەر كېلىدىكەن. ئۇلار ئەتىرگۈل قاشاسىنى بۆسۈپ ئۆتۈپ ئور- دىغا كىرمەكچى بولىدىكەنۇ، مەقسىتىنى ئىشقا ئاشۇرالماي كەينىگە يېنىشقا مەجبۇر بولىدىكەن. چۈنكى، ئەتىرگۈللەر مەھكەم گىرەلىشىۋېلىپ ئۇلارنى ئۆتكۈزمەيدىكەن.\n\n نۇرغۇن يىللار ئۆتۈپ بۇ ئەلگە بىر شاھزادە كېلىپ قاپتۇ. ئۇ بىر ئاقساقالدىن ئەتىرگۈل قاشاسى، قاشا ئىچىدىكى ئوردا، ئوردىدا يۈز يىلدىن بېرى ئۇخلاپ ياتقان ئەتىر- گۈل مەلىكە، پادىشاھ بىلەن خانىش ۋە باشقىلار توغرىسىدىكى رىۋايەتنى ئاڭلاپتۇ. ئاقساقال ئۆز زامانىسىدا بوۋىسىدىن نۇرغۇن شاھزادىلەرنىڭ قاشادىن ئۆتۈپ ئوردىغا كىرمەكچى بولغىنىنى، بىراق ئەتىرگۈل قاشاسىنىڭ ئۇ شاھزادىلەرنى ئۆتكۈزمىگەنلىكىنىمۇ ئاڭلىغانىكەن.\n\n -قورقمايمەن، -دەپتۇ شاھزادە، -مەن ئوردىغا كىرىپ گۈزەل ئەتىرگۈل مەلىكىنى كۆرىمەن. \n\nياخشى نىيەتلىك ئاقساقال ھەرقانچە نەسىھەت قىلىپمۇ شاھزادىنى نىيىتىدىن ياندۇرالماپتۇ.\n\n بۇ چاغدا يۈز يىل توشۇپ، ئەتىرگۈل مەلىكىنىڭ ئوي- غىنىدىغان ۋاقتىمۇ بولۇپ قالغانىكەن. شاھزادە ئەتىرگۈل قاشاسىنىڭ يېنىغا بېرىپتىكەن، پورەكلەپ ئېچىلىپ كەتكەن چىرايلىق ئەتىرگۈللەر ئۆزلۈكىدىن ئىككى تەرەپكە يېتىپ ئۇنىڭغا يول ئېچىپ بېرىپتۇ. شاھزادە ئۆتۈپ كەتكەندىن كېيىن يەنە قايتىدىن ئەتىرگۈل قاشاسىغا ئايلىنىپتۇ.  \n\nشاھزادە ئوردا ئىچىگە كىرىپ شۇنداق قارىسا، ئات بىلەن ئالا ئىت يەردە يېتىپ، ئۆگزىدىكى كەپتەر تۇمشۇقىنى قانى- تىنىڭ ئاستىغا تىقىپ ئۇخلاۋاتقۇدەك. ئۆينىڭ ئىچىگە كى- رىپ قارىغۇدەك بولسا، چىۋىنلار تامغا چاپلاشقان پېتى، ئاشخانىدىكى ئۇستام بالىنى ئۇرۇش ئۈچۈن قولىنى كۆتۈر- گەن پېتى ئۇخلاۋاتقانمىش، خىزمەتكار ئايالمۇ قارا خورازنى يۇڭداۋاتقىنىچە ئۇخلاپ قاپتۇدەك. شاھزادە يەنىمۇ ئىچكىرى- لەپ ئوردىغا كىرىپتۇ. قارىسا بۇ يەردىمۇ پۈتۈن ئادەم ئۇخلاۋاتقان، پادىشاھ بىلەن خانىشمۇ تەختنىڭ ئۈستىدە ئۇخلاپ ياتقانمىش. شاھزادە ئوردىنىڭ ئىچكىرىسىگە قاراپ مېڭىۋېرىپتۇ. ئەتراپ شۇنچىلىك جىمجىت ئىكەنكى، شاھزا- دىنىڭ تىنىقىمۇ ئۆزىگە ئاڭلىنىپ تۇرىدىكەن. ئاخىردا  شاھزادە قوڭغۇراق راۋىقىنىڭ ئالدىغا كەپتۇ ۋە ئەتىرگۈل مەلىكە ياتقان ئۆينىڭ ئىشىكىنى ئېچىپ كىرىپتۇ. كارىۋاتتا ياتقان ئەتىرگۈل مەلىكە شۇنداق چىرايلىق ئىكەنكى، شاھزادە ئۇنىڭدىن كۆزىنى ئۈزەلمەي قاپتۇ. ئۇ ئېڭىشىپ ئەتىر- گۈل مەلىكىنى سۆيۈپتۇ. \n\nشاھزادىنىڭ سۆيۈشى بىلەن تەڭ ئەتىرگۈل مەلىكە كۆزىنى ئېچىپ شاھزادىگە مېھىر بىلەن قاراپتۇ. ئىككىيلەن قول تۇتۇشقان پېتى قوڭغۇراق راۋىقىدىن پەسكە چۈشۈپتۇ. بۇ چاغدا پادىشاھ، خانىش ۋە ئوردىدىكى ھەممە ئادەم ئويغىنىپ، بىر - بىرىگە چەكچەيگىنىچە قاراپ قېلىشىپتۇ. ھويلىدىكى ئات ئويغىنىپ سىلكىنىپتۇ، ئىتمۇ قۇيرۇقىنى شىپاڭشىتىپ ئويناقلاشقا باشلاپتۇ، ئۆگزىدىكى كەپتەرلەرمۇ تۇمشۇقىنى قانىتىنىڭ ئاستىدىن چىقىرىپ ئۆپچۆرىگە قاراپتۇ ۋە دالىغا قاراپ ئۇچۇپ كېتىپتۇ. تامدىكى چىۋىنلارمۇ مىدىراپتۇ. ئوچاقتىكى ئوت يالقۇنجاپ كۆيۈپ، گۆشمۇ پاژىلداپ قورۇلۇشقا باشلاپتۇ. ئاشپەز ئۇستام بالىنىڭ كاچىتىغا بىرنى ساپتىكەن، ئۇ ۋارقىراپ يىغلاپ كېتىپتۇ. خىزمەتكار ئايال خورازنى يۇڭداپ بوپتۇ. شاھزادە بىلەن ئەتىرگۈل مەلىكە ناھايىتى داغدۇغىلىق توي مۇراسىمى ئۆتكۈزۈپتۇ. ئۇلار تا قېرىپ ئۆلگۈچە بەختلىك، خۇشال - خۇرام ياشاپتۇ.  \n\n\n从前有位国王和王后，他们一直没有孩子，心里非常渴望能有一个。一次，王后正在沐浴，一只螃蟹从水里爬到岸上，说：“你的愿望很快就会实现，你将生下一个女儿。”这话果然应验了。国王为公主的降生高兴极了，下令举行盛大的庆典，并邀请了国内的仙女们。因为他只有十二个金盘子，所以有十三位仙女，只能不请其中一位。\n\n仙女们来到庆典上，在宴会结束时为公主送上祝福：第一位送美德，第二位送美貌，其他的依次送上了世上一切珍贵美好的东西。正当第十一位仙女刚说出她的祝福时，那没被邀请的第十三位仙女怒气冲冲地闯了进来，喊道：“因为你们没有请我，所以我要告诉你们：你们的女儿在十五岁那年，会被纺锤刺伤，倒地而死！”父母惊恐万分，但第十二位仙女还有一个祝福要说，她说：“这不会成为死亡，她只会沉睡百年。”\n\n国王仍希望能救他亲爱的孩子，于是下令全国所有的纺锤全部销毁。公主渐渐长大，美丽非凡。一天，她正好满十五岁，国王和王后外出了，宫殿里只剩她一人。她四处随意闲逛，最后来到一座古老的塔楼前。一道狭窄的楼梯通向上面，她好奇心起，便爬了上去，来到一扇小门前，门里插着一把黄色的钥匙。她转动钥匙，门一下子开了，里面是一间小屋，坐着一位老太婆在纺麻线。公主很喜欢这位老太婆，便和她聊起天来，说自己也想试试纺线，便从她手中拿过纺锤。可她刚碰到纺锤，就被刺伤了手，立刻倒在地上，沉沉睡去。\n\n就在这一刻，国王带着全体朝臣回来了，于是所有的一切都开始入睡：马厩里的马、屋顶上的鸽子、院子里的狗、墙上的苍蝇，甚至连灶膛里噼啪燃烧的火都静了下来，沉沉睡去。锅里的肉不再滋滋作响，厨师松开了正揪着的厨房小伙计的头发，女仆也丢下了手里正在拔毛的鸡，睡着了。整座王宫四周长起了一道荆棘篱笆，越长越高，最后把整个宫殿都遮住了，什么也看不见。\n\n听到美丽玫瑰公主传说的王子们纷纷前来，想救出她，但他们都无法穿过那道篱笆——荆棘仿佛像手一样紧紧握在一起，不让他们通过。\n\n\n许多年过去了，一天，又有一位王子来到这个国家。他听一位老人讲起玫瑰篱笆的故事——说篱笆后面有一座王宫，宫里有一位美若天仙的公主，名叫玫瑰公主，她已经沉睡百年，国王、王后和所有朝臣也都陪着她一起沉睡着。老人还听祖父说过，已经有许多王子试图穿过篱笆，都被荆棘缠住，没能进去。\n\n年轻的王子说：“我不怕，我要进去看看美丽的玫瑰公主。”\n\n不管好心的老人怎么劝阻，王子都不听。\n\n这时，百年之期恰好已满，玫瑰公主苏醒的时刻到了。王子走到玫瑰篱笆前，只见篱笆上开满了美丽硕大的玫瑰花，它们自动向两边分开，为他让出一条路。他走过去后，玫瑰篱笆又在他身后合拢成一道密实的屏障。\n\n王子走进王宫，看见马厩里的马和院子里的猎狗都躺着睡觉；屋顶上的鸽子把嘴藏在翅膀下，也在睡。他走进屋内，墙上的苍蝇一动不动；厨房里，厨师还举着手要打那个小伙计，女仆还坐在那里拔鸡毛，都像雕像一样睡着。王子继续往里走，只见整个大殿里的人都睡在地上，国王和王后也高高地睡在王座之上。\n\n四周静得出奇，连他自己的呼吸声都听得清清楚楚。最后，他来到那座古塔前，推开玫瑰公主所在房间的小门。她正躺在床上，美得令人惊叹，王子目不转睛地看着她，情不自禁地俯下身，吻了她。\n\n这一吻，玫瑰公主立刻睁开眼睛，温柔地注视着王子。两人手牵着手走下塔楼。这时，国王、王后和所有朝臣都醒了过来，互相惊奇地打量着。马厩里的马站起来抖了抖身子；猎狗摇着尾巴欢跳起来；屋顶上的鸽子把嘴从翅膀下拿出来，环顾四周，飞向了田野；墙上的苍蝇嗡嗡地飞动起来；厨房里的火又熊熊燃烧起来，肉又滋滋地煎了起来；厨师打了小伙计一个耳光，小伙计疼得哇哇叫；女仆拔完了鸡毛。\n\n王子和玫瑰公主举行了盛大隆重的婚礼，他们幸福快乐地生活，一直到老。",

      "title": "گرىم چۆچەكلىرى: بۇلبۇل تۇمشۇق پادىشاھ",

      "desc": "بۇرۇننىڭ بۇرۇنىسىدا، بىر پادىشاھنىڭ ئاجايىپ چىرايلىق، ئەمما بەكمۇ تەكەببۇر بىر قىزى بار ئىكەن. ئۇ ئۆزىگە ئۆيلىنىش تەلىپىنى قويغان يىگىتلەرنىڭ ھېچقايسىسىغا نەزىرىنىمۇ سېلىپ باقمايدىكەن. ئۇ كەلگەن يىگىتلەرنى ياراتماي قايتۇرۇۋەتكەننى ئاز دەپ، ئۇلارغا ھەر خىل لەقەملەرنى قويۇپ مازاق قىلىدىكەن. بىر قېتىم پادىشاھ كاتتا زىياپەت ئۇيۇشتۇرۇپ قىزغا كۆزى چۈشكەن يىگىتلەرنىڭ ھەممىسىنى ئوردىسىغا يىغىپتۇ. يىگىتلەر مەرتىۋىسى بويىچە قاتارغا تىزىلىپتۇ. ئەڭ ئالدىدا پادىشاھلار، ئۇلارنىڭ كەينىدە گېرىتسوگ، ماركىز، گراف، بارونلار، ئەڭ ئاخىرىدا ئاقسۆڭەكلەر تۇرۇپتۇ. مەلىكە قاتار تۇرغانلارنى بىر باشتىن كۆرۈپ چىقىپتۇ. شۇنىڭدىمۇ ھەممىسىدىن بىرەر - يېرىم ئېۋەن تېپىپ ئۇلارنى ياراتماپتۇ. ئۇ بىرىنچى يىگىتنى «بەك سېمىز، كاۋا قورساق ئىكەن» دېسە، ئىككىنچىسىنى «ئۇ- زۇنتۇرا بىر نېمە ئىكەن، يول ماڭسا سۇۋادان تېرەكتەك لىڭشىيدىكەن»؛ ئۈچىنچىسىنى «پاكار ھەم سېمىز ئىكەن، بۇنداقلار زېرەك كەلمەيدۇ»؛ تۆتىنچىسىنى «چىرايى ئۆلۈكنىڭكىدەك تاتىراڭغۇ ئىكەن»؛ بەشىنچىسىنى «كۈركە توخۇدەك قىپقىزىل ئىكەن» دەپتۇ. ئالتىنچىسىنىڭ قەددى- قامىتى دېگەندەك رۇس ئەمەس ئىكەن، مەلىكە ئۇنى： «ئوچاق بېشىدا تۇرۇپ قالغان ھۆل ياغاچ ئىكەن» دەپتۇ. \nمەلىكە ھەممە ئادەمنىڭ ئەيىبىنى ئېچىپ مازاق قىلى- ۋېرىپتۇ. بولۇپمۇ ئەڭ ئالدىدا تۇرغان، ئېڭىكى سەل قىڭ- غىر، ئەمما ئاق كۆڭۈل بىر پادىشاھنى بەكرەك زاڭلىق قى- لىپ كۈلۈپتۇ：\n _ ۋاي توۋا قىپتىمەن، ئۇنىڭ ئېڭىكى بۇلبۇلنىڭ تۇمشۇقىغا ئوخشايدىكىنە، ھا... ھا...  \n\nشۇنىڭدىن ئېتىبارەن بۇ پادىشاھقا «بۇلبۇل تۇمشۇق پادىشاھ» دەپ لەقەم سىڭىپ قاپتۇ. ياشانغان پادىشاھ قىزىنىڭ ھاكاۋۇرلۇقتىن ئۆزىنى بىلەلمەيۋاتقانلىقىنى، شۇنچە لايىقنىڭ بىرەرىنىمۇ ياراتمايۋاتقانلىقىنى كۆرۈپ دەرغەزەپكە كەپتۇ - دە، خەپ، سېنى ئىشىك ئالدىغا سەدىقە تىلەپ كەلگەن تىلەمچىگە بېرىۋەتمىسەم، دەپ قەسەم قىلىۋېتىپتۇ.\n بىرنەچچە كۈندىن كېيىن كوچىمۇكوچا ساز چېلىپ تىلەمچىلىك قىلىدىغان بىر تىلەمچى ئوردىنىڭ دېرىزىسى تۈۋىدە ناخشا ئېيتىپ سەدىقە تىلەپتۇ.\n بۇنى ئاڭلىغان پادىشاھ تىلەمچىنى چاقىرىپ كىرىشكە بۇيرۇپتۇ. ئۈستۋېشى جالدۇر - جۇلدۇر ۋە مەينەت تىلەمچى پادىشاھ بىلەن مەلىكىنىڭ ئالدىغا كېلىپ ناخشا ئېيتىپ بېرىپتۇ ۋە سەدىقە سوراپتۇ. \n_ ناخشاڭ مېنى بەكمۇ مەپتۇن قىلدى، شۇڭا قىزىمنى ساڭا بېرىمەن، _ دەپتۇ پادىشاھ. \nمەلىكە بۇنى ئاڭلاپ قاتتىق چۆچۈپ كېتىپتۇ ۋە ئۇنداق قىلماڭ، دەپ دادىسىغا يېلىنىپتۇ. ئەمما، پادىشاھ: \n_ مەن سېنى تىلەمچىگە بېرىمەن، دەپ قەسەم ئىچكەن، قەسىمىمدىن يېنىۋالسام بولمايدۇ، _ دەپ ئۆز گېپىدە چىڭ تۇرۇۋاپتۇ.\n مەلىكىنىڭ ھەرقانچە ئۇنىمىغىنىغا قارىماي، پادىشاھ  ئۇلارنىڭ تويىنى قىلىپ قويۇپتۇ. تويدىن كېيىن پادىشاھ قىزىنى ئالدىغا چاقىرتىپ：\n _ سەن ئەمدى تىلەمچىنىڭ ئايالى، ئوردىدا تۇرىۋەرسەڭ قاملاشمايدۇ. شۇڭا، ئوردىدىن چىقىپ كېتىپ ئېرىڭ بىلەن كۈنۈڭنى كۈن ئەت، _ دەپتۇ. \nتىلەمچى ئۇنى يېتىلىگەن پېتى ئوردىدىن ئاچىقىپ كې- تىپتۇ. مەلىكىمۇ ئىلاجسىز ئۇنىڭ كەينىدىن مېڭىپتۇ. ئۇلار يۈرۈپتۇ، يۈرۈپتۇ، يۈرگەندىمۇ مول يۈرۈپتۇ. بىر كۈنلەردە قېلىن ئورمانغا يېتىپ كەپتۇ. \n_ پاھ، بۇ گۈزەل ئورمان كىمنىڭ؟ _ دەپ سوراپتۇ مەلىكە.\n _ بۇلبۇل تۇمشۇق پادىشاھنىڭ، سەن ئۇنىڭغا تەگكەن بولساڭ، بۇ ئورمان سېنىڭ بولاتتى.\n _ ئاھ ، مەندەك مەزلۇمە ئاجىز بەندەڭگە ئىچىڭ ئاغرىسۇن، مېنى بۇلبۇل تۇمشۇق پادىشاھقا نېسىپ قىلغايسەن، _ دەپ ئاھ ئۇرۇپتۇ مەلىكە. \nئۇزۇن ئۆتمەي ئۇلار بىر يايلاقتىن ئۆتۈپتۇ. مەلىكە يەنە:\n _ بۇ ياپيېشىل گۈزەل يايلاق كىمنىڭكى؟ _ دەپ سوراپتىكەن، تىلەمچى：\n _ بۇلبۇل تۇمشۇق پادىشاھنىڭ. ئۇنىڭغا تەگكەن بول- ساڭ، بۇ يايلاق سېنىڭ بولاتتى، _ دەپ جاۋاب بېرىپتۇ.  \n_ ئاھ ، مەندەك ئاجىز بەندەڭگە رەھىم قىلغايسەن. مېنى بۇلبۇل تۇمشۇق پادىشاھقا ئاتا قىلغايسەن!\n ئۇلار يەنە مېڭىپ بىر چوڭ شەھەرگە يېتىپ كەپتۇ. \n_ بۇ گۈزەل شەھەر كىمگە تەئەللۇق؟ _ دەپ سوراپتۇ مەلىكە. \n_ بۇلبۇل تۇمشۇق پادىشاھقا، ئۇنىڭغا تەگكەن بولساڭ، بۇ شەھەر سېنىڭ بولاتتى. \n_ ئاھ ، مېنى كەچۈرگىن، مېنى بۇلبۇل تۇمشۇق پادىشاھقا خوتۇن قىلغىن !\n بۇ گەپلەرنى ئاڭلىغان تىلەمچى خاپا بولۇپ: \n_ ھە دېسە باشقا بىر ئەرنىڭ خوتۇنى بولسام، دەپ يۈ- رىسەنغۇ، ئاچچىقىمنى كەلتۈرۈپ. مەن سېنى خارلاۋاتمايد غاندىمەن؟ _ دەپتۇ.\n ئۇلار ئاخىر بىر كىچىك كەپنىڭ ئالدىغا كېلىپ توختاپتۇ.\n _ ۋاي  نېمانچىۋالا كىچىك كەپە بۇ، بۇ قايسى بىچارىنىڭ كەپىسىدۇر؟_ دەپ سوراپتۇ مەلىكە ھەيرانلىق بىلەن.\n _ مېنىڭ كەپەم، بۇنىڭدىن كېيىن ئىككىمىز مۇشۇ كەپىدە ئۆي تۇتىمىز. \nمەلىكە كەپنىڭ ئىشىكىدىن ئېڭىشىپ كىرىشكە مەجبۇر بوپتۇ. ئۇ ئىشىكتىن كىرىپلا：\n-خىزمەتكار قېنى؟-دەپ سوراپتۇ.   \n_ نېمە؟ خىزمەتكار دېدىڭمۇ؟ خىزمەتكار نېمە قىلىدۇ بۇ يەردە، لازىم بولسا ئۆزۈڭ قوپۇپ قىلىسەن. دەرھال ئوت ياق، ئاندىن سۇ ئەكېلىپ ئاش ئەت. ھېرىپ ھالىم قالمىدى، _ دەپتۇ تىلەمچى.\n ئۆمرىدە ئوچاقنىڭ ئالدىغا كېلىپ باقمىغان مەلىكە ئاش ئېتىشنى ھېچ ئەپلەشتۈرەلمەپتۇ. ئاشنى تىلەمچى ئۆزى ئەتمەكتىن باشقا ئامال قالماپتۇ. ئۇ بىرنېمىلەرنى قىلىپ ئاشنى ئېتىپتۇ. ئۇلار قورساقلىرى ئاران - ئاران تويغۇدەك ئازغىنە ئاشنى يەپ ئۇخلاپتۇ. ئەتىسى ئەتىگىنى تىلەمچى  ئۇنى ئۆي ئىشلىرىنى قىل، دەپ تۈرتۈپ ئويغىتىۋېتىپتۇ. ئۇلار شۇنچە غورىگىل تۇرمۇش كەچۈرسىمۇ، بىرنەچچە كۈندىن كېيىن يېمەك - ئىچمىكى ئۈزۈلۈپ قاپتۇ.\n _ خوتۇن، _ دەپتۇ ئېرى، _ يېتىپ يېسە تاغمۇ توشىمايدۇ، سەن سېۋەت توقۇپ ساتقىن.\n ئۇ چىقىپ سۆگەت تاللىرىنى كېسىپ كەپتۇ. مەلىكە بۇ تاللاردا سېۋەت توقۇشقا باشلاپتۇ. بىراق قاتتىق سۆگەت تاللىرى ئۇنىڭ يۇمشاق قوللىرىنى تىلىۋېتىپتۇ. بۇنى كۆر- گەن ئېرى: \n_ بۇ ئىشنى قىلالمىغۇدەكسەن. ياخشىسى، چاق ئېگىر، _ دەپتۇ. \nمەلىكە چاق ئېگىرىشكە ئولتۇرۇپتىكەن، چاقنىڭ شانىسى ئۇنىڭ يۇمران بارماقلىرىنى كېسىپ قانىتىۋېتىپتۇ.\n بۇنى كۆرگەن ئېرى: \n _ قولۇڭدىن ھېچ ئىش كەلمەيدىغان خوتۇن ئىكەنسەن، ئىسىت، سېنى ئالمىساممۇ بوپتىكەن. ئەمدى مەن ساپالچىلىق قىلاي، مەن پىشۇرغان ساپال قاچىلارنى بازارغا ئاپىرىپ سات، _ دەپتۇ.\n«ۋاي شورۇم قۇرۇسۇن. دادامنىڭ دۆلىتىدىن كەلگەنلەر كۆرۈپ قالسا نېمىمۇ دەپ كېتەر - ھە؟» دەپ ئويلاپتۇ مەلىكە. \nلېكىن، مۇشۇنداق جان باقماي ئامال يوق ئىكەن. بول-  مىسا ئەر - خوتۇن ئىككىيلەن ئاچلىقتىن ئۆلۈپ قالىدى- كەن. دەسلەپتە مەلىكىنىڭ چىرايىغا مەھلىيا بولغان خې- رىدارلار ئۇنىڭ كوزا - كومۇلىرىنى ئېلىپ، قانچە پۇل دې- سە شۇنچە پۇل بېرىپتۇ. ھەتتا پۇل بېرىپ ھېچنېمە ئالماي كەتكەنلەرمۇ بوپتۇ. مەلىكە ۋە ئۇنىڭ ئېرى شۇ پۇللارغا تايىنىپ كۈن ئاپتۇ. ئارىدىن ئۇزۇن ئۆتمەي مەلىكىنىڭ ئې- رى يەنە بىرمۇنچە ساپال قاچىلارنى ئەكېلىپ مەلىكىنى سېتىپ كېلىشكە بۇيرۇپتۇ. مەلىكە بازارنىڭ چېتىدە يايما ئېچىپ ساپال قاچىلارنى سېتىشقا باشلاپتۇ. شۇ ئەسنادا، خۇددى ئاسماندىن چۈشكەندەكلا، بىر مەست چەۋەنداز ئېتىنى چاپتۇرغىنىچە كېلىپ مەلىكىنىڭ ساپال قاچىلىرىنى ئېتىغا دەسسىتىپ كۇكۇم - تالقان قىلىۋېتىپتۇ. مەلىكە خاپىچىلىقتا يىغلىۋېتىپتۇ.\n «ئاھ تەڭرىم! _ دەپتۇ ئۇ، _ مەن شۇنچىۋالا بىتەلەيمۇ ！ئەمدى ئېرىمدىن تىل - ئاھانەت ئاڭلايدىغان بولدۇم !» \nمەلىكە ئۆيگە كېلىپ بولغان ۋەقەنى ئېرىگە سۆزلەپ بېرىپتۇ.\n _ ماۋۇ پالاكەتچىلىكنى كۆرمەمدىغان. كىم سېنى بازارنىڭ چېتىدە ئولتۇرۇپ سودا قىل، دېدى؟ يىغلاشتىن باشقا ھېچنېمىنى بىلمەيدىغان خوتۇن ئىكەنسەن. مەن پادى- شاھنىڭ ئوردىسىغا بېرىپ ئاشخانىغا خىزمەتكار ئالامسىلەر، دەپ سورىغانىدىم. ئۇلار سېنىڭ ئاشخانىدا ئىشلىشىڭگە ئۇنىدى. خىزمىتىڭنىڭ بەدىلىگە قورسىقىڭنى باقىدىغان بولدى، _ دەپتۇ ئېرى. \nشۇنداق قىلىپ مەلىكە ئاشخانىدا يۈگۈر - يېتىم ئىش قىلىدىغان خىزمەتكارغا ئايلىنىپتۇ. ئۇ ئاشقان - تاشقان تاماقلارنى ياغاچتىن ياسالغان قاچىلارغا سېلىپ كىيىمىنىڭ ئىچىگە ئېسىۋالىدىكەن ۋە ئۇنى ئۆيىگە ئەكېتىپ قورسىقى- نى باقىدىكەن.\n بىر كۈنى پادىشاھنىڭ چوڭ ئوغلىنىڭ تويى بوپتۇ. بى- چارە مەلىكە توي كۆرۈش ئۈچۈن شاھ دەرۋازىسىنىڭ ئالدىدا تەلمۈرۈپ تۇرۇپتۇ. قارىسا ئوردا ئىچى ئاجايىپ بېزەلگەن، ھەر خىل زىبۇزىننەتلەرنى تاقىغان، بىر - بىرىدىن پۇزۇر كىيىنگەن مېھمانلار ئايىغى ئۈزۈلمەي كېلىپ تۇرغۇدەك. بۇنى كۆرگەن مەلىكىنىڭ ئىچى ئېچىشىپ، ئۆز تەقدىرىدىن زارلىنىپتۇ. ئۆزىنىڭ مۇشۇ خورلۇققا، مۇشۇنداق يوقسۇز- لۇققا چۈشۈپ قېلىشىغا سەۋەبچى بولغان تەكەببۇرلۇقىغا لەنەتلەر ياغدۇرۇپتۇ. زىياپەتكە توشۇلۇۋاتقان نازۇنېمەتلەرنىڭ پۇرىقىدىن مەلىكە بىھوش بوپتۇ. مۇلازىملار بەزىدە ئۇنىڭغا ئېشىپ قالغان سەي - تاماقلاردىن ئانچە - مۇنچە بېرىپ قويىدىكەن. مەلىكە ئۇنى ئۆيىگە ئاپىرىپ يېيىش ئۈچۈن ياغاچ قاچىلىرىغا قۇيۇۋالىدىكەن. شۇ ئەسنادا، مامۇق، تاۋار- دۇردۇن، زەرلەرگە پۈركىنىپ، بوينىغا ئالتۇن زەنجىر ئاسقان شاھزادە مەلىكە تۇرغان يەرگە كېلىپ قاپتۇ.  \nئۇ بۇ ساھىبجامال قىزنىڭ بوسۇغا سىرتىدا تۇرغانلىقىنى كۆرۈپ ئۇنى تانسىغا تەكلىپ قىپتۇ. لېكىن، مەلىكە شاھزادىنىڭ تەكلىپىنى رەت قىپتۇ ھەم بەكمۇ چۆچۈپ كې- تىپتۇ. چۈنكى، مەلىكىنىڭ ئالدىدا تۇرغان كىشى قانداقتۇر بىر شاھزادە ئەمەس، بەلكى بۇرۇن ئۇنىڭغا ئۆيلىنىش تەك- لىپىنى قويغان، ئەمما مەلىكە ئۇنى مازاق قىلىپ كۈلگەن ھېلىقى بۇلبۇل تۇمشۇق پادىشاھ ئىكەن. بۇلبۇل تۇمشۇق پادىشاھ مەلىكىنىڭ ئۇنىمىغىنىغا قارىماي يېتىلەپ زالغا ئەكىرىپتۇ.\n تانسا ئويناۋېتىپ، مەلىكىنىڭ ياغاچ قاچىلىرىنى ئې- سىۋالغان شوينىسى ئۈزۈلۈپ كېتىپتۇ. ئاشقان - تاشقان سەي - تاماقلار ھەريان چېچىلىپتۇ. بۇنى كۆرگەنلەر ئۈچى- يى ئۈزۈلگۈچە كۈلۈشۈپتۇ. بىچارە مەلىكىگە ئاسمان يىراق، يەر قاتتىق تۇيۇلۇپتۇ. مەلىكە ئالدى - كەينىگە قارىماي قېچىپتىكەن، پەلەمپەيدە ئۇنىڭغا بىر يىگىت يېتىشىۋېلىپ ئالدىنى توسۇپتۇ. مەلىكە شۇنداق قارىسا، ئالدىدا يەنىلا شۇ بۇلبۇل تۇمشۇق پادىشاھ تۇرغۇدەك. ئۇ مەلىكىگە مۇلايىملىق بىلەن: \n_ قورقماڭ، مەن سىز بىلەن ھېلىقى ئەسكى كەپىدە بىللە ياشاۋاتقان تىلەمچى بولىمەن. مەن سىزنى چىن قەلبىمدىن ياخشى كۆرگەنلىكىم ئۈچۈن تىلەمچى قىياپىتىگە كىرىۋالغانىدىم. ساپال قاچىلىرىڭىزنى ئاتقا دەسسىتىۋەتكەن ھېلىقى چەۋەندازمۇ مەن. مېنىڭ بۇنداق قىلىشىمدىكى سەۋەب، سىزنىڭ ھېچكىمنى ئۆزىڭىزگە تەڭ قىلمايدىغان مىجەزىڭىزنى تۈزىتىش، مېنى مازاق قىلغان چاغدىكى تەكەببۇرلۇقىڭىز ئۈچۈن سىزنى توۋا قىلدۇرۇش ئىدى، - دەپتۇ. \n_ مەن ناھايىتى چوڭ سەۋەنلىك ئۆتكۈزدۈم. مەن سىزگە لايىق ئەمەس، _ دەپ يىغلاپ كېتىپتۇ مەلىكە. \n پادىشاھ ئۇنىڭغا：  \n_ بولدى، كۆڭلىڭىزنى بۇزماڭ، ئۆتكەن ئىشقا سالاۋات. ھازىر بىز توي مەرىكىمىزنى خۇشال - خۇرام ئۆت- كۈزەيلى، _ دەپتۇ.\n كېنىزەكلەر كېلىپ مەلىكىگە گۈزەل لىباسلارنى كىي- دۈرۈپتۇ. مەلىكىنىڭ دادىسىمۇ تويغا كەپتۇ. پۈتۈن خالايىق توي تەنتەنىسىگە چۆمۈپتۇ. مەلىكە بىلەن پادىشاھنىڭ ھەقىقىي بەختى ۋە خۇشاللىقى مانا ئەمدى باشلىنىپتۇ. \n\nبۈگۈنكى چۆچىكىمىز مۇشۇيەردە ئاخىرلاشتى كىلەركى مەزمۇنىمىزدا: « ئالتۇن پەيلىك غاز » دىگەن چۆچەكدىن بەھرىمان بۇلىمىز .ھارمىغايسىلەر! ! ! \n\n从前有一位国王，他有个女儿长得美丽无比，却骄傲自大，目中无人，谁也不配做她丈夫。她把求婚者一个个全都回绝，还对他们百般挖苦嘲笑。\n一次，国王大摆宴席，邀请远近所有前来求婚的男子。来宾按身份地位排成长队：先是各国国王，随后公爵、侯爵、伯爵、骑士。公主从队伍前面走过，对每个人都能挑出毛病。这个太胖 ——“酒桶！” 她说；那个太高 ——“竹竿，走路晃晃悠悠！”第三个太矮 ——“矮冬瓜，笨手笨脚！”第四个脸色惨白 ——“活死人！”第五个满脸通红 ——“火公鸡！”第六个腰背不直 ——“窑里没干透的木头！”\n\n就这样，她人人都挑剔，嘲笑得最厉害的是一位模样和善的国王。这位国王下巴稍稍向前突出。“瞧啊！” 公主高声取笑，“他的下巴活像画眉鸟的嘴！” 打那以后，大家便叫他画眉嘴国王。\n\n老国王看见女儿一味嘲弄别人，勃然大怒，发誓要把她嫁给第一个上门乞讨的乞丐。\n\n几天之后，一个沿街卖唱的乞丐来到王宫窗下唱歌，乞求施舍。国王听见歌声，立刻派人传乞丐进来。乞丐衣衫褴褛，肮脏不堪。国王对他说：“昨天我立下誓言，要把女儿嫁给第一个来这里的乞丐。你就是他，准备举行婚礼吧！”\n\n公主惊恐万分，哭着哀求父亲，可国王毫不动摇：“我发过誓，必须兑现！” 婚礼很快举办完毕。婚宴结束，国王告诉女儿：“你丈夫是乞丐，王宫不再是你的家，跟着他走吧。”\n\n乞丐牵着公主离开王宫。他们走到一片大森林，公主问：“这片美丽的森林是谁的？”“它属于画眉嘴国王，要是你当初嫁给他，森林就是你的。”“唉，我真蠢！当初我要是嫁给画眉嘴国王多好！”\n\n接着他们来到一片草原，公主又问：“这片绿油油的草原是谁的？”“属于画眉嘴国王，要是你当初嫁给他，草原就是你的。”“唉，我真蠢！当初我要是嫁给画眉嘴国王多好！”\n\n随后他们走到一座繁华的大城市。公主问：“这座漂亮的城市是谁的？”“属于画眉嘴国王，要是你当初嫁给他，城市就是你的。”公主满心悔恨：“唉，我当初真不该嘲笑画眉嘴国王！”\n\n终于，两人来到一间狭小破旧的茅屋。“这就是我的家，” 乞丐说，“快进去。”公主必须弯腰才能钻进低矮的小门。“仆人在哪儿？” 她问道。“哪有什么仆人，” 乞丐回答，“凡事你得自己动手。快生火烧水，准备晚饭。”\n\n公主根本不会生火做饭，乞丐只好亲自忙活。晚饭十分简陋。第二天一早，乞丐就把她叫醒，逼着她做家务。\n\n几天过后，家里存粮吃光了。丈夫说：“老婆，咱们坐吃山空不行，你来编筐谋生吧。”他砍来柳枝，公主开始编筐。粗硬的枝条划破她娇嫩的双手，鲜血直流。“看来不行，” 丈夫说，“还是纺线试试。”她坐下纺线，粗糙纱线勒得手指伤口更多。“你什么活儿都干不了！” 丈夫说，“我打算做陶器买卖，你去集市叫卖锅碗瓢盆。”\n\n公主心里害怕：“要是我父亲王国里的熟人赶集看见我卖陶器，一定会笑话我！” 可没有别的出路。起初生意尚可，人们见她容貌好看，愿意买她的东西。赚到一点钱后，丈夫又购进大批陶器。公主坐在集市角落摆摊。忽然，一个醉酒骑兵策马直冲过来，所有陶器全被踏得粉碎。公主失声痛哭。“哭有什么用！” 丈夫说，“我看你实在做不了买卖。我去王宫打听好了，厨房缺一名女佣，你去做工，管吃住。”\n\n就这样，公主成了王宫厨娘。她听从厨师差遣，干最脏最累的活。两边衣兜各装一只小陶罐，收集残羹剩饭，带回家和丈夫充饥。\n\n不久，王宫举办王子大婚庆典。可怜的女佣悄悄站在大厅门外观望。大厅灯火辉煌，宾客衣着华美。她回想自己从前的身份，痛恨曾经的傲慢，落到如今穷困屈辱的地步。佳肴香气飘来，仆人偶尔丢给她一点剩菜，她小心装进陶罐。\n\n\n这时，盛装的王子走入大厅。公主抬头一看，正是画眉嘴国王！王子径直走来，拉住她的手邀请跳舞。公主惊慌躲闪，羞愧得无地自容。她拼命挣脱，可王子不肯放手。拉扯之间，衣兜系带断裂，陶罐落地碎裂，汤水剩饭洒了一地。宾客哄堂大笑，纷纷嘲弄她。公主只想找地缝钻进去，飞奔逃出大厅。\n\n她跑下楼梯，却被画眉嘴国王拦住。国王温和地对她说：“别害怕，我和那个茅屋乞丐、集市上踏碎陶器的骑兵，都是同一个人。我因为爱你，才乔装考验你；一切磨难，都是为了磨去你的傲气，惩罚你当初对我的羞辱。”\n\n公主泪流满面：“我犯下天大过错，不配做你的妻子！”画眉嘴国王说：“苦难已经结束。过去的事一笔勾销，现在我们举办真正的婚礼。”\n\n侍女们为她换上华贵礼服。她的父王与满朝大臣也赶来，祝福她和画眉嘴国王。盛大的婚礼正式开始，举国欢庆。",

        function sortBooksData(books, sortType){
            const type = sortType || document.getElementById('sortSelect').value;
            switch(type){
                case 'title-asc': return [...books].sort((a,b) => a.title.localeCompare(b.title));
                case 'title-desc': return [...books].sort((a,b) => b.title.localeCompare(a.title));
                case 'cate-asc': return [...books].sort((a,b) => a.cate.localeCompare(b.cate));
                case 'random': return [...books].sort(() => Math.random() - 0.5);
                default: return [...books].sort((a,b) => { if(a.isTop && !b.isTop) return -1; if(!a.isTop && b.isTop) return 1; return b.topOrder - a.topOrder; });
            }
        }

        function debounce(func, delay){
            let timer = null;
            return function(){ if(timer) clearTimeout(timer); timer = setTimeout(func, delay); };
        }

        function renderBooks(){
            const shelf = document.getElementById('bookshelf');
            if(!shelf) return;
            const activeCate = document.querySelector('.tab.active').dataset.cate;
            const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
            
            let filteredBooks = allBooks.filter(book => {
                const excludeFromAll = activeCate === 'all' && (book.cate === 'Yazmilar' || book.cate === 'Yzamlilar');
                const cateMatch = activeCate === 'all' || book.cate === activeCate;
                const searchMatch = !searchText || book.title.toLowerCase().includes(searchText) || book.tags.toLowerCase().includes(searchText) || book.cate.toLowerCase().includes(searchText) || (book.desc && book.desc.toLowerCase().includes(searchText));
                return !excludeFromAll && cateMatch && searchMatch;
            });
            
            filteredBooks = sortBooksData(filteredBooks);
            
            const resultCount = document.getElementById('searchResultCount');
            if(resultCount) resultCount.textContent = searchText ? `🔍 搜索 "${searchText}" 找到 ${filteredBooks.length} 本书` : '';
            
            if(filteredBooks.length === 0){
                shelf.innerHTML = '<div class="empty-tip">📚 暂无匹配书籍</div>';
                return;
            }
            
            if(activeCate === 'Yazmilar'){
                renderYazmilar(filteredBooks, shelf);
            }else{
                const fragment = document.createDocumentFragment();
                filteredBooks.forEach(book => {
                    const card = document.createElement('div');

                    card.onclick = () => openReadPage(book);
                    const topTag = isAdminLogin && book.isTop ? '<div class="top-tag">📌 置顶</div>' : '';

                    card.innerHTML = `${topTag}<img class="book-cover lazy-img" data-src="${escapeHtml(book.cover)}" alt="${escapeHtml(book.title)}" onerror="this.src='https://via.placeholder.com/150x240?text=Cover'"><div class="book-info"><div class="book-title">${escapeHtml(book.title)}</div><div class="book-cate">${escapeHtml(book.cate)}</div></div>${topBtnHtml}${delBtnHtml}${editBtnHtml}`;

        let lazyLoadObserver = null;

        function initLazyLoad(){
            if(lazyLoadObserver) lazyLoadObserver.disconnect();
            const lazyImages = document.querySelectorAll('.lazy-img');
            if('IntersectionObserver' in window){
                lazyLoadObserver = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if(entry.isIntersecting){
                            const img = entry.target;
                            const src = img.getAttribute('data-src');
                            if(src){ img.src = src; img.classList.add('loaded'); observer.unobserve(img); }
                        }
                    });
                }, { rootMargin: '50px', threshold: 0.1 });
                lazyImages.forEach(img => lazyLoadObserver.observe(img));
            }else{
                lazyImages.forEach(img => { const src = img.getAttribute('data-src'); if(src){ img.src = src; img.classList.add('loaded'); } });
            }
        }
