            const textarea = document.getElementById('carouselImages');
            if(!textarea) return;
            const lines = textarea.value.split('\n').map(l => l.trim()).filter(l => l);
            if(lines.length === 0){ showToast('请至少输入一个图片URL！', 'error'); return; }
            const carouselData = lines.map((line, index) => {
                const parts = line.split('|');
                return {
                    url: parts[0] || '',
                    link: parts[1] || '',
                    title: parts[2] || ['欢迎来到 Hekaya', '每日推荐', '阅读分享'][index % 3] || '轮播图',
                    desc: parts[3] || ['发现精彩的维吾尔语书籍', '精选好书，每日更新', '与朋友分享阅读心得'][index % 3] || ''
                };
            });
            localStorage.setItem('carouselData', JSON.stringify(carouselData));
            renderCarousel(carouselData);
            document.querySelector('.modal-overlay').remove();
            showToast('✅ 轮播图已保存！', 'success');
        }

        function renderCarousel(data){
            slides = data;
            const carousel = document.getElementById('carousel');
            const indicators = document.getElementById('carouselIndicators');
            if(!carousel || !indicators) return;
            
            carousel.innerHTML = slides.map((slide, index) => `
                <div class="carousel-slide" onclick="openCarouselLink(${index})">
                    <img src="${escapeHtml(slide.url)}" alt="Slide ${index+1}" onerror="this.src='https://picsum.photos/1200/400?random=${index}'">
                    <div class="carousel-overlay"></div>
                    <div class="carousel-caption">
                        <h3>${escapeHtml(slide.title)}</h3>
                        <p>${escapeHtml(slide.desc)}</p>
                    </div>
                </div>
            `).join('');
            
            indicators.innerHTML = slides.map((_, index) => `
                <button class="carousel-indicator ${index === 0 ? 'active' : ''}" onclick="goToSlide(${index})"></button>
            `).join('');
            
            currentSlide = 0;
        }

        function openCarouselLink(index){
            const slide = slides[index];
            if(slide && slide.link){
                window.open(slide.link, '_blank');
            }
        }

        function loadCarouselData(){
            try{
                const saved = localStorage.getItem('carouselData');
                if(saved){
                    const data = JSON.parse(saved);
                    if(data && Array.isArray(data) && data.length > 0){
                        renderCarousel(data);
                        return;
                    }
                }
            }catch(e){}
            renderCarousel([
                { url: 'https://picsum.photos/1200/400?random=1', title: '欢迎来到 Hekaya', desc: '发现精彩的维吾尔语书籍' },
                { url: 'https://picsum.photos/1200/400?random=2', title: '每日推荐', desc: '精选好书，每日更新' },
                { url: 'https://picsum.photos/1200/400?random=3', title: '阅读分享', desc: '与朋友分享阅读心得' }
            ]);
        }

        // ===== Site Stats =====
        // 访客数据由 visitor-badge 实时统计（无域名限制，免注册）：
        //   今日访问 = 按天计数的独立计数器（每日自动归零）
        //   总访客数 = 每台浏览器只累计一次（近似独立访客）
        //   总访问量 = 线上每次页面加载 +1
        // 本地 file:// / localhost 打开时不计数，显示"部署后显示"
        
        function initSiteStats(){
            updateRealStats();
            initViewBadges();
        }
        
        function updateRealStats(){
            // Real data: book count and category count
            const bookCountEl = document.getElementById('statBookCount');
            if(bookCountEl) bookCountEl.textContent = allBooks.length;
            
            const categories = new Set(allBooks.map(b => b.cate));
            const cateCountEl = document.getElementById('statCategoryCount');
            if(cateCountEl) cateCountEl.textContent = categories.size;
            
            // Real page load time
            const loadTimeEl = document.getElementById('statLoadTime');
            if(loadTimeEl){
                if(window.performance && window.performance.timing){
                    const loadTime = (Date.now() - window.performance.timing.navigationStart) / 1000;
                    loadTimeEl.textContent = loadTime.toFixed(2) + 's';
                } else {
                    loadTimeEl.textContent = '计算中...';
                }
            }
        }
        
        function initViewBadges(){
            const host = location.hostname;
            const isLocal = !host || location.protocol === 'file:' || host === 'localhost' || host === '127.0.0.1';
            const today = new Date().toISOString().slice(0, 10);
            
            const badges = [
                { id: 'badgeToday',    key: 'daily.' + today, left: 'Today',    color: '#00b894', shouldInc: true },
                { id: 'badgeVisitors', key: 'visitors',       left: 'Visitors', color: '#0984e3', shouldInc: false },
                { id: 'badgeViews',    key: 'views',          left: 'Views',    color: '#6c5ce7', shouldInc: true }
            ];
            
            badges.forEach(b => {
                const img = document.getElementById(b.id);
                if(!img) return;
                
                // 本地环境不接入统计，避免计入测试数据
                if(isLocal){
                    img.remove();
                    const fallback = document.createElement('span');
                    fallback.textContent = '部署后显示';
                    fallback.style.cssText = 'font-size:13px;font-weight:500;';
                    img.parentNode.appendChild(fallback);
                    return;
                }
                
                let shouldInc = b.shouldInc;
                if(b.key === 'visitors'){
                    // 每台浏览器只计数一次
                    shouldInc = !localStorage.getItem('vb_counted');
                    try { localStorage.setItem('vb_counted', '1'); } catch(e){}
                }
                
                img.src = 'https://visitor-badge.laobi.icu/badge?page_id=' + encodeURIComponent(host + '.' + b.key) +
                    '&left_text=' + b.left +
                    '&left_color=%23595959&right_color=' + encodeURIComponent(b.color) +
                    '&height=20&radius=3' +
                    (shouldInc ? '' : '&query_only=true');
            });
        }
        
        function toggleFooterStats(){
            const stats = document.getElementById('footerStats');
            const text = document.getElementById('statsToggleText');
            if(stats.classList.contains('collapsed')){
                stats.classList.remove('collapsed');
                text.textContent = '收起统计';
            } else {
                stats.classList.add('collapsed');
                text.textContent = '展开统计';
            }
        }
        
        function initPage(){
            loadTheme();
            loadBooks();
            loadWelcomeData();
            loadCarouselData();
            updateWelcomePage();
            initTab();
            initLazyLoad();
            initSiteStats();
            renderBooks();
            if(sessionStorage.getItem('isAdminLogin') === 'true'){
                isAdminLogin = true;
                document.body.classList.add('admin-login');
                updateAdminUI();
            }
        }

        function login(){
            const password = document.getElementById('adminPassword').value;
            if(password === 'admin'){
                isAdminLogin = true;
                sessionStorage.setItem('isAdminLogin', 'true');
                document.body.classList.add('admin-login');
                updateAdminUI();
                renderBooks();
                document.querySelector('.modal-overlay').remove();
                showToast('✅ 登录成功！', 'success');
            }else{
                showToast('❌ 密码错误！', 'error');
            }
        }

        function welcomeLogin(){
            const password = document.getElementById('welcomeLoginPassword').value;
            if(password === 'admin'){
                isAdminLogin = true;
                sessionStorage.setItem('isAdminLogin', 'true');
                document.body.classList.add('admin-login');
                document.querySelector('.modal-overlay').remove();
                showToast('✅ 登录成功！', 'success');
                updateAdminUI();
            }else{
                showToast('❌ 密码错误！', 'error');
            }
        }

        function logout(){
            if(!confirm('确定要退出登录吗？')) return;
            isAdminLogin = false;
            sessionStorage.removeItem('isAdminLogin');
            document.body.classList.remove('admin-login');
            updateAdminUI();
            renderBooks();
            showToast('🚪 已退出登录', 'info');
        }

        function toggleTheme(){
            const isDark = document.body.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            const btn = document.querySelector('.theme-toggle-btn');
            if(btn) btn.textContent = isDark ? '☀️' : '🌙';
        }

        function loadTheme(){
            const saved = localStorage.getItem('theme');
            const isDark = saved === 'dark' || saved === null;
            if(isDark){
                document.body.classList.add('dark');
                const btn = document.querySelector('.theme-toggle-btn');
                if(btn) btn.textContent = '☀️';
            }
        }

        let carouselTimer = null;

        function startCarousel(){
            carouselTimer = setInterval(nextSlide, 5000);
        }

        function stopCarousel(){
            if(carouselTimer){ clearInterval(carouselTimer); carouselTimer = null; }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initPage();
            startCarousel();
        });

        document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape'){
                const modal = document.querySelector('.modal-overlay');
                if(modal) modal.remove();
                const readPage = document.getElementById('readPage');
                if(readPage && readPage.classList.contains('show')) closeReadPage();
            }
        });

        document.addEventListener('click', (e) => {
            if(e.target.classList && e.target.classList.contains('modal-overlay')){
                e.target.remove();
            }
        });
    </script>
</body>
</html>
